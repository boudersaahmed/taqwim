/* One UI look: soft sky-blue surfaces, large rounded cards, coloured icon tiles, light and dark themes. Printed pages keep their own fixed colours. */
:root{
  --bg:#f0f7fb;--surface:#ffffff;--soft:#e8f3f8;--ink:#1e293b;--muted:#64748b;--line:#dbeafe;
  --accent:#38bdf8;--accent-ink:#0369a1;--accent-soft:rgba(56,189,248,.15);--on-accent:#020617;
  --ok:#15803d;--ok-fill:#22c55e;--ok-soft:rgba(34,197,94,.14);--warn:#b45309;--warn-soft:rgba(245,158,11,.16);--danger:#dc2626;--danger-soft:rgba(239,68,68,.12);
  --shadow:0 12px 35px -8px rgba(14,165,233,.09),0 4px 12px -2px rgba(0,0,0,.03);
  --ui:Tajawal,"Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --doc:"Khalid Art bold",Amiri,"Traditional Arabic","Times New Roman",serif;
  --radius:24px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b131d;--surface:#131c2e;--soft:#1b263d;--ink:#f8fafc;--muted:#94a3b8;--line:rgba(56,189,248,.16);
  --accent:#38bdf8;--accent-ink:#7dd3fc;--accent-soft:rgba(56,189,248,.16);--on-accent:#020617;
  --ok:#4ade80;--ok-fill:#22c55e;--ok-soft:rgba(34,197,94,.16);--warn:#fbbf24;--warn-soft:rgba(245,158,11,.16);--danger:#f87171;--danger-soft:rgba(239,68,68,.16);
  --shadow:0 12px 35px -8px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b131d;--surface:#131c2e;--soft:#1b263d;--ink:#f8fafc;--muted:#94a3b8;--line:rgba(56,189,248,.16);
  --accent:#38bdf8;--accent-ink:#7dd3fc;--accent-soft:rgba(56,189,248,.16);--on-accent:#020617;
  --ok:#4ade80;--ok-fill:#22c55e;--ok-soft:rgba(34,197,94,.16);--warn:#fbbf24;--warn-soft:rgba(245,158,11,.16);--danger:#f87171;--danger-soft:rgba(239,68,68,.16);
  --shadow:0 12px 35px -8px rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--ui);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;transition:background-color .25s}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}
svg.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.18em}
.lat{direction:ltr;unicode-bidi:isolate}

/* icon tiles */
.tile{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font:800 18px/1 var(--ui)}
.tile svg.ic{width:21px;height:21px}
.t-sky{background:rgba(56,189,248,.16);color:#0284c7}
.t-amber{background:rgba(245,158,11,.16);color:#d97706}
.t-emerald{background:rgba(16,185,129,.15);color:#059669}
.t-violet{background:rgba(139,92,246,.15);color:#7c3aed}
.t-rose{background:rgba(244,63,94,.13);color:#e11d48}
.t-indigo{background:rgba(99,102,241,.15);color:#4f46e5}
:root[data-theme="dark"] .t-sky{color:#38bdf8}:root[data-theme="dark"] .t-amber{color:#fbbf24}:root[data-theme="dark"] .t-emerald{color:#34d399}
:root[data-theme="dark"] .t-violet{color:#a78bfa}:root[data-theme="dark"] .t-rose{color:#fb7185}:root[data-theme="dark"] .t-indigo{color:#818cf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-sky{color:#38bdf8}:root:not([data-theme="light"]) .t-amber{color:#fbbf24}:root:not([data-theme="light"]) .t-emerald{color:#34d399}
  :root:not([data-theme="light"]) .t-violet{color:#a78bfa}:root:not([data-theme="light"]) .t-rose{color:#fb7185}:root:not([data-theme="light"]) .t-indigo{color:#818cf8}}

/* top bar of inner pages: compact title appears after scrolling past the large one */
.topbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s,background-color .2s}
body.scrolled .topbar,.topbar.solid{border-bottom-color:var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent)}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.bar .t{flex:1;min-width:0;opacity:0;transition:opacity .2s}
body.scrolled .bar .t,.topbar.solid .bar .t{opacity:1}
.bar .t h1{font:800 17px/1.35 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t p{font:500 12px/1.4 var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{max-width:720px;margin:0 auto;padding:6px 22px 14px}
.ttl h1{font:800 26px/1.3 var(--ui)}
.ttl p{font:500 13.5px/1.5 var(--ui);color:var(--muted);margin-top:3px}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);padding:0;box-shadow:0 2px 6px rgb(0 0 0 / .04)}
.icon-btn svg.ic{width:18px;height:18px}
.sync{font:800 11.5px var(--ui);display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);background:var(--soft);padding:7px 11px;border-radius:12px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok);background:var(--ok-soft)}.sync.busy{color:var(--accent-ink);background:var(--accent-soft)}.sync.off{color:var(--warn);background:var(--warn-soft)}
.sync:empty{display:none}

/* home header */
.head{position:relative;max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(14px + env(safe-area-inset-top)) 22px 6px}
.head .theme{position:absolute;left:18px;top:calc(14px + env(safe-area-inset-top))}
.logo{width:104px;height:104px;border-radius:50%;background:#fff;border:2px solid rgba(56,189,248,.3);box-shadow:0 14px 28px -10px rgba(14,165,233,.4);display:grid;place-items:center;padding:7px;margin-bottom:12px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.head .rep{font:700 12px var(--ui);color:var(--muted)}
.head .sch{font:800 25px/1.3 var(--ui);margin-top:2px}
.lift{margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel.glow::after{content:"";position:absolute;left:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:var(--accent);opacity:.15;filter:blur(26px);pointer-events:none}
.panel>*{position:relative;z-index:1}
.wel{font:500 13.5px var(--ui);color:var(--muted)}
.hello{font:800 24px/1.35 var(--ui)}
.hello b{color:var(--accent-ink)}
.lbl{font:700 12px var(--ui);color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:700 12.5px var(--ui);padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:10px 18px;border-radius:18px;border:1px solid var(--line);background:var(--soft);font:700 15px var(--ui);text-decoration:none;color:inherit;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg.ic{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 10px 22px -10px rgba(14,165,233,.65)}
.btn.big{min-height:56px;font-size:16.5px;width:100%}
.btn.small{min-height:40px;padding:6px 13px;font-size:13.5px;border-radius:14px}
.btn.ok{background:var(--ok-fill);border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(34,197,94,.65)}
.btn.xl{background:#16a34a;border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(34,197,94,.65)}
.btn.ghost{background:var(--surface)}
.btn.ghost svg.ic,.btn:not(.primary):not(.ok):not(.xl) svg.ic{color:var(--accent-ink)}
.btn.link{background:transparent;border-color:transparent;color:var(--muted);min-height:40px;font-size:13.5px}
.btn.danger-t{color:var(--danger);background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5}

.sec{margin-top:22px;display:grid;gap:12px}
.sec>h2{font:800 14px var(--ui);color:var(--muted);padding:0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font:800 11.5px var(--ui);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill svg.ic{width:12px;height:12px}
.pill.draft{background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog.full i{background:var(--ok-fill)}
.meta{font:500 12.5px var(--ui);color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-height:48px;font-size:14.5px}

/* grouped list of classes */
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:var(--shadow)}
.class-item{text-align:start;width:100%;background:transparent;border:0;border-radius:22px;padding:12px;display:flex;align-items:center;gap:13px}
.class-item+.class-item{border-top:1px solid var(--line);border-radius:0 0 22px 22px}
.class-item .tile{font-size:16px}
.class-item h3{font:800 15.5px/1.4 var(--ui)}
.class-item p{font:500 12px/1.4 var(--ui);color:var(--muted);margin-top:2px}
.class-item>svg.ic{width:14px;height:14px;color:var(--muted)}

/* request tiles */
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reqbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px 14px;display:flex;flex-direction:column;gap:9px;text-align:start;position:relative;box-shadow:var(--shadow);min-height:132px}
.reqbtn b{font:800 15px/1.35 var(--ui)}
.reqbtn small{font:500 11.5px/1.5 var(--ui);color:var(--muted)}
.reqbtn .go{position:absolute;left:14px;top:18px;color:var(--muted);width:13px;height:13px}
.reqbtn.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.reqbtn>span:not(.tile){display:flex;flex-direction:column;gap:3px}
.reqbtn.wide>span:not(.tile){flex:1}
.reqbtn.wide .go{position:static}
.nb{position:absolute;top:10px;left:34px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font:800 12px/22px var(--ui);text-align:center}

/* settings */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:6px;border-radius:18px;border:1px solid var(--line);width:100%}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:13px;font:700 14px var(--ui);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 6px 14px -6px rgba(14,165,233,.7)}
.setting{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.setting p{font:800 15px var(--ui)}
.setting small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.install-card{background:linear-gradient(90deg,var(--soft),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.install-card p{flex:1;font:700 13.5px/1.5 var(--ui)}
.install-card p small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.install-card .icon-btn{border:0;box-shadow:none;background:transparent;color:var(--muted)}
.foot{padding:20px 0 30px;text-align:center;display:grid;gap:4px;justify-items:center}
.safe{padding:12px 14px;border-radius:16px;background:var(--ok-soft);font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.safe svg.ic{margin-top:3px;color:var(--ok)}
.note{padding:11px 14px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font:600 13px/1.6 var(--ui);display:flex;gap:9px;align-items:flex-start}
.note svg.ic{margin-top:3px}
.form{display:grid;gap:16px}
.fld{display:grid;gap:8px;font:800 13.5px var(--ui);align-content:start}
.fld small{color:var(--muted);font-weight:500;font-size:11.5px;line-height:1.5}
.fld .err{color:var(--danger);font:700 12.5px var(--ui)}
input[type=text],input[type=tel],input[type=url],input[type=password],textarea,select,input[type=date],input[type=time],input[type=number]{width:100%;min-height:52px;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 14px;font:500 16px var(--ui);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.ltr{direction:ltr;text-align:left}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.greet{border-radius:20px;padding:16px;background:var(--accent-soft);color:var(--accent-ink);font:800 22px/1.4 var(--ui);text-align:center}

/* bottom navigation */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.bnav .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-around}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 10.5px var(--ui);color:var(--muted);padding:7px 14px;border-radius:16px;min-width:66px}
.bnav button svg.ic{width:19px;height:19px}
.bnav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
body.has-nav #app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.has-nav .toast{bottom:calc(96px + env(safe-area-inset-bottom))}

/* subject cards */
.subj{text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.subj .h{display:flex;align-items:center;gap:12px}
.subj .tile{width:44px;height:44px;border-radius:15px;font-size:19px}
.subj h3{font:800 16px var(--ui);flex:1}
.tbl-card{display:flex;gap:13px;align-items:center}
.tbl-card h3{font:800 15px var(--ui)}
.tbl-card p{font:500 12px/1.5 var(--ui);color:var(--muted);margin-top:2px}

/* grading */
.tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:2px 14px 12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 3px 7px;font:800 11.5px/1.3 var(--ui);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;min-height:66px;text-align:center}
.tab.exam{border-style:dashed;border-color:var(--warn)}

<script>
'use strict';
/* =========================================================
   منصة التقويم المستمر – مدرسة أحمد فقير
   لا توجد أسماء تلاميذ هنا: تُجلب من جدول المدرسة عند مسح رمز القسم
   ========================================================= */
const REP = 'الجمهورية الجزائرية الديمقراطية الشعبية';
const SCHOOL_DEFAULT = 'مدرسة أحمد فقير';
const TERMS = ['الأول', 'الثاني', 'الثالث'];
const SCHOOL_FULL = 'المدرسة الابتدائية الشهيد أحمد فقير – أولاد يعيش';
const DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const MONTHS = { '01': 'جانفي', '02': 'فيفري', '03': 'مارس', '04': 'أفريل', '05': 'ماي', '06': 'جوان', '07': 'جويلية', '08': 'أوت', '09': 'سبتمبر', '10': 'أكتوبر', '11': 'نوفمبر', '12': 'ديسمبر' };
const monthName = m => m ? `${MONTHS[m.slice(5, 7)]} ${m.slice(0, 4)}` : '';
const LANGS = {
  fr: { levels: [4, 5], name: 'اللغة الفرنسية', icon: 'Fr', exam: 'fe', doms: ['Expression et communication orales', 'Lecture et récitation', 'Production écrite'], examN: 'Examen',
    t: { no: 'N°', name: 'Nom et prénom', ca: 'Moyenne de l’évaluation continue', ex: 'Examen', avg: 'Moyenne de la matière', ev: 'Évaluation continue', rep: 'République Algérienne Démocratique et Populaire', school: 'École primaire Chahid Ahmed Fakir – Ouled Yaïch',
      title: (t, y) => `Évaluations continues – ${['1er', '2e', '3e'][t - 1]} trimestre ${y}`, sub: (l, g) => `Français – ${l}e année primaire – Groupe ${g} – Phase ${l <= 4 ? 2 : 3}`,
      teacher: 'Enseignant(e)', sign: 'Signature', note: { 4: 'Note : 4e année primaire – l’évaluation des apprentissages au cours du premier trimestre se fait sous forme d’observations qualitatives descriptives reflétant le niveau d’acquisition des compétences de base.' } } },
  en: { levels: [3, 4, 5], name: 'اللغة الإنجليزية', icon: 'En', exam: 'ee', doms: ['Oral expression and communication', 'Reading and recitation', 'Written production'], examN: 'Exam',
    t: { no: 'No.', name: 'Surname and first name', ca: 'Continuous assessment average', ex: 'Exam', avg: 'Subject average', ev: 'Continuous assessment', rep: 'People’s Democratic Republic of Algeria', school: 'Chahid Ahmed Fakir Primary School – Ouled Yaich',
      title: (t, y) => `Continuous Assessment – ${['First', 'Second', 'Third'][t - 1]} Term ${y}`, sub: (l, g) => `English – Year ${l} primary – Group ${g} – Phase ${l <= 4 ? 2 : 3}`,
      teacher: 'Teacher', sign: 'Signature', note: { 3: 'Note: Year 3 primary – the evaluation of learning during the first term takes the form of descriptive qualitative notes reflecting the level of acquisition of the basic skills.' } } }
};
const CLASS_SUBS = ['ar', 'math', 'mu', 'pl'];
function subjectsFor(level){
  const out = level >= 2 ? [
    { id: 'ar', name: 'اللغة العربية', icon: 'ع', exam: 'ae',
      domains: [{ f: 'a1', n: 'التعبير والتواصل الشفوي' }, { f: 'a2', n: 'القراءة والمحفوظات' }, { f: 'a3', n: level <= 2 ? 'الكتابة والإملاء' : 'الإنتاج الكتابي' }] },

  }

const subOf = (level, id) => subjectsFor(level).find(s => s.id === id);

/* ---------- local storage (this phone only) ---------- */
const mem = {};
const store = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
let me = store.get('tq:me');
let classes = store.get('tq:classes', []);
const saveClasses = () => store.set('tq:classes', classes);
const getStep = () => +(store.get('tq:step') || 0.25);
const cacheOf = k => store.get('tq:c:' + k);
const setCache = (k, c) => store.set('tq:c:' + k, c);
const pendKey = (k, t) => 'tq:p:' + k + ':' + t;
const pendOf = (k, t) => store.get(pendKey(k, t), { items: {} });
const setPend = (k, t, p) => store.set(pendKey(k, t), p);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = v => Math.round((v + 1e-9) * 100) / 100;
const fmt = v => v == null ? '' : String(round2(v));
const app = $('#app');
const ui = { tab: {} };
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch(e){} }
let toastTimer;
function toast(msg, action){
  const old = $('.toast'); if (old) old.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { action.fn(); t.remove(); };
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), action ? 5000 : 3200);
}
function sheet(html){
  const ov = $('#overlay');

async function api(url, body, ms = 25000){

  } finally { clearTimeout(tm); }
}

   المزامنة: كل ضغطة تُحفظ في الهاتف فوراً ثم تُرسل إلى الجدول
   ========================================================= */
const syncState = {};
let syncTimers = {}, syncing = {};
function setSync(k, s){
  syncState[k] = s;
  const el = $('#syncFlag');
  if (el && el.dataset.k === k){
    el.className = 'sync ' + ({ ok: 'ok', busy: 'busy', pending: 'busy', off: 'off' }[s] || '');
    el.textContent = { ok: 'محفوظ في الجدول', busy: 'جارٍ الإرسال…', pending: 'جارٍ الإرسال…', off: 'محفوظ في الهاتف، سيُرسل لاحقاً' }[s] || '';
  }
}
function scheduleSync(k, ms = 1200){ clearTimeout(syncTimers[k]); syncTimers[k] = setTimeout(() => syncNow(k), ms); }
const hasPend = k => [1, 2, 3].some(t => Object.keys(pendOf(k, t).items).length);
async function syncNow(k){
  const c = cacheOf(k), entry = classes.find(x => x.k === k);
  if (!c || !entry) return false;
  if (syncing[k]) return null;
  syncing[k] = true;
  try {
    for (const t of [1, 2, 3]){
      const p = pendOf(k, t), keys = Object.keys(p.items);
      if (!keys.length) continue;
      setSync(k, 'busy');
      const sent = { ...p.items };
      const changes = keys.map(key => { const [s, f] = key.split('|'); return { s, f, v: sent[key] }; });
      const r = await api(entry.api, { action: 'save', k, term: t, t: me, changes });
      if (!r || !r.ok) throw r || new Error('save_failed');
      const cc = cacheOf(k), p2 = pendOf(k, t);
      if (cc && cc.term === t){
        keys.forEach(key => { const [s, f] = key.split('|'); cc.marks[s] = cc.marks[s] || {}; if (sent[key] == null) delete cc.marks[s][f]; else cc.marks[s][f] = sent[key]; });
        setCache(k, cc);
      }
      keys.forEach(key => { if (p2.items[key] === sent[key]) delete p2.items[key]; });
      setPend(k, t, p2);
    }
    const left = [1, 2, 3].some(t => Object.keys(pendOf(k, t).items).length);
    setSync(k, left ? 'pending' : 'ok');
    if (left) scheduleSync(k, 600);
    return !left;
  } catch(e){
    setSync(k, 'off');
    scheduleSync(k, 20000);
    return false;
  } finally { syncing[k] = false; }
}
window.addEventListener('online', () => classes.forEach(c => scheduleSync(c.k, 300)));

/* ---------- class data ---------- */
async function fetchClass(i){
  const entry = classes[i];
  const r = await api(entry.api, { action: 'class', k: entry.k, t: me });
  if (!r || !r.ok) throw r;
  const old = cacheOf(entry.k);
  r.edited = (old && old.term === r.term && old.edited) || {};
  setCache(entry.k, r);
  entry.label = r.cls.label; entry.n = r.students.length; saveClasses();
  return r;
}
function ctxOf(i){
  const entry = classes[i], c = cacheOf(entry.k);
  if (!c) return null;
  const p = pendOf(entry.k, c.term).items;
  const allowed = c.allowed || CLASS_SUBS;
  return {
    k: entry.k, i, c, term: c.term, year: c.year, school: c.school || SCHOOL_DEFAULT, cls: c.cls, students: c.students,
    kind: c.kind || 'class', lang: c.lang || '', allowed,
    subjects: subjectsFor(c.cls.level).filter(s => allowed.includes(s.id)), teacher: me ? me.name : '',
    get(sid, f){ const key = sid + '|' + f; if (key in p) return p[key]; const m = c.marks[sid]; return m && m[f] != null ? m[f] : null; }
  };
}
function setMark(ctx, sid, f, v){
  const val = v == null ? null : Math.min(10, Math.max(0, round2(v)));
  const p = pendOf(ctx.k, ctx.term); p.items[sid + '|' + f] = val; setPend(ctx.k, ctx.term, p);
  const c = cacheOf(ctx.k), sub = ctx.subjects.find(s => itemsOf(s).some(it => it.f === f));
  if (c && sub && c.confirms && c.confirms[sub.id]){ c.edited = c.edited || {}; c.edited[sub.id] = true; setCache(ctx.k, c); }
  setSync(ctx.k, 'pending'); scheduleSync(ctx.k);
  return ctxOf(ctx.i);
}
function stats(ctx, sub){
  const items = itemsOf(sub), n = ctx.students.length;
  let filled = 0; const per = items.map(it => { const f = ctx.students.reduce((a, s) => a + (ctx.get(s.id, it.f) != null ? 1 : 0), 0); filled += f; return f; });
  return { filled, needed: n * items.length, per, n };
}
function subStatus(ctx, sub){
  const c = ctx.c, cf = c.confirms && c.confirms[sub.id], ed = c.edited && c.edited[sub.id];
  if (cf && !ed) return { cls: 'ok', txt: 'مؤكد' };
  if (cf && ed) return { cls: 'warn', txt: 'عُدّل بعد التأكيد' };
  return { cls: 'draft', txt: stats(ctx, sub).filled ? 'مسودة' : 'لم يبدأ' };
}
function caAvg(ctx, sid, sub){
  const v = sub.domains.map(d => ctx.get(sid, d.f));
  return v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0) / v.length;
}
function subjAvg(ctx, sid, sub){
  const ca = caAvg(ctx, sid, sub), ex = ctx.get(sid, sub.exam);
  return ca == null || ex == null ? null : (ca + ex) / 2;
}

async function scanQR(){
  const canScan = 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && !IS_ARTIFACT;
  if (!canScan){
    sheet(`<h2>مسح رمز القسم</h2><ol><li>افتح كاميرا الهاتف ووجّهها نحو رمز QR الخاص بقسمك.</li><li>اضغط على الرابط الذي يظهر فوق الرمز.</li><li>سيفتح القسم مباشرة في التطبيق.</li></ol>
      <div class="acts"><button class="btn primary" type="button" data-close="1">حسناً</button></div>`);
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch(e){ toast('لم يُسمح باستعمال الكاميرا'); return; }
  const box = sheet(`<h2>وجّه الكاميرا نحو رمز القسم</h2><video id="scanV" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover"></video>
    <div class="acts"><button class="btn" type="button" data-close="1">إلغاء</button></div>`);
  const v = box.querySelector('#scanV'); v.srcObject = stream;
  const stop = () => stream.getTracks().forEach(t => t.stop());
  try { await v.play(); } catch(e){}
  const det = new BarcodeDetector({ formats: ['qr_code'] });
  while (document.body.contains(v)){
    try { const r = await det.detect(v); if (r.length){ stop(); closeSheet(); handleLink(r[0].rawValue); return; } } catch(e){}

  }

}

function tableFiles(ctx, which){

async function sendTables(ctx, which, admin, miss){
  const main = which === 'main', f = tableFiles(ctx, which);
  try {
    if (!admin){ busy(true, 'جارٍ حفظ العلامات في جدول المدرسة…'); await syncNow(ctx.k); }
    busy(true, 'جارٍ إعداد ملف PDF…');
    const pdf = await renderPDF(pagesOf(ctx, which), main, `التقويمات المستمرة - ${ctx.cls.label}`);
    busy(true, 'جارٍ إعداد ملف Excel…');
    const xlsx = main ? await buildXLSX(ctx) : await buildLangXLSX(ctx, which);
    busy(true, 'جارٍ الإرسال إلى البريد…');
    const files = [{ name: f.pdf, b64: await blobB64(pdf) }, { name: f.xlsx, b64: await blobB64(xlsx) }];
    const body = admin ? { action: 'mail', key: admin.key, id: admin.id, from: 'المدير', which, term: ctx.term, missing: miss, files }
                       : { action: 'mail', k: ctx.k, t: me, which, term: ctx.term, missing: miss, files };
    const r = await api(admin ? admin.api : classes[ctx.i].api, body, 120000);
    if (!r || !r.ok) throw r;
    busy(false); buzz();
    const rec = { at: r.at, by: admin ? 'المدير' : me.name };
    if (admin){ const c0 = adminCtxCache[admin.id]; if (c0){ c0.c.mailed = c0.c.mailed || {}; c0.c.mailed[which] = rec; } }
    else { const c = cacheOf(ctx.k); if (c){ c.mailed = c.mailed || {}; c.mailed[which] = rec; if (r.to) c.mailTo = r.to; setCache(ctx.k, c); } }
    toast('أُرسل الجدول إلى البريد · ' + dmyhm(r.at));
    if (admin){ if (curView() === 'aexp') viewAdminExport(admin.id, true); }
    else if (location.hash === '#exp-' + ctx.i){ const y = window.scrollY; viewExport(ctx.i); window.scrollTo(0, y); }
  } catch(e){ busy(false); console.error(e); toast(errText(e)); }
}

const pagesOf = (ctx, which) => which === 'main' ? docPages(ctx) : langPages(ctx, which);

// جدول الفرنسية أو الإنجليزية: A4 بالطول، من اليسار إلى اليمين
function langPages(ctx, lang){
  const L = LANGS[lang], T = L.t, sub = subOf(ctx.cls.level, lang), lv = ctx.cls.level;
  const n = ctx.students.length, AVAIL = 800;
  let per = n, rowH = Math.min(26, Math.floor(AVAIL / Math.max(n, 1)));
  if (rowH < 16){ rowH = 18; per = Math.floor(AVAIL / rowH); }

async function saveBlob(blob, filename){
  if (IS_ARTIFACT){
    let dl = null; try { dl = await window.claude.use('downloads'); } catch(e){}
    if (!dl){ toast('التنزيل غير متاح في هذه النافذة'); return; }
    try { await dl.save({ filename, data: blob }); toast('تم حفظ الملف'); } catch(e){ toast(e && e.code === 'declined' ? 'أُلغي الحفظ' : 'تعذّر حفظ الملف'); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
  toast('تم تنزيل الملف');
}
async function shareBlob(blob, filename, type){
  try { await navigator.share({ files: [new File([blob], filename, { type })], title: filename }); }
  catch(e){ if (e && e.name !== 'AbortError') toast('تعذّرت المشاركة، استعمل التنزيل'); }
}
async function exportCtx(ctx, kind, share, which){

  busy(true, kind === 'pdf' ? 'جارٍ إعداد ملف PDF…' : 'جارٍ إعداد ملف Excel…');

    const main = which === 'main';
    const blob = kind === 'pdf' ? await renderPDF(pagesOf(ctx, which), main, `التقويمات المستمرة - ${ctx.cls.label}`) : main ? await buildXLSX(ctx) : await buildLangXLSX(ctx, which);

    if (share) await shareBlob(blob, name, kind === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    else await saveBlob(blob, name);
  } catch(e){ busy(false); console.error(e); toast('حدث خطأ أثناء إعداد الملف'); }
}

let pollTimer = null;
function startPoll(fn, ms){ stopPoll(); pollTimer = setInterval(fn, ms); }
function stopPoll(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function sysNotify(title, body){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const opt = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'taqwim-inbox', renotify: true, data: { url: appBase() + '#inbox-sum' } };
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opt)).catch(() => {});
    else new Notification(title, opt);
  } catch(e){}
}
function noteCounts(cn){
  if (!cn) return;
  const total = cn.summons || 0;
  try { if (navigator.setAppBadge) total ? navigator.setAppBadge(total) : navigator.clearAppBadge(); } catch(e){}
  const prev = store.get('tq:seen');
  if (prev){
    const msgs = [];
    if (cn.summons > prev.s) msgs.push(`${cn.summons - prev.s} طلب استدعاء جديد`);
    if (cn.lastAtt && cn.lastAtt > (prev.a || '')) msgs.push('إرسال جديد لنسبة الحضور الشهرية');
    if (msgs.length){ toast('🔔 ' + msgs.join(' · ')); sysNotify('منصة التقويم المستمر', msgs.join(' · ')); }
  }
  store.set('tq:seen', { s: cn.summons || 0, a: cn.lastAtt || '' });
}

const xFill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
const xLine = { style: 'thin', color: { argb: 'FF000000' } }, xBorder = { top: xLine, bottom: xLine, left: xLine, right: xLine };

  ws.mergeCells(`A1:${last}1`); ws.getCell('A1').value = title; ws.getCell('A1').font = { name: FONT, size: 14 }; ws.getCell('A1').alignment = { horizontal: 'center', readingOrder: 'rtl' }; ws.getRow(1).height = 24;
  ws.mergeCells(`A2:${last}2`); ws.getCell('A2').value = sub; ws.getCell('A2').font = { name: FONT, size: 11 }; ws.getCell('A2').alignment = { horizontal: 'center', readingOrder: 'rtl' };
  const hr = ws.getRow(4); head.forEach((h, k) => { const c = hr.getCell(k + 1); c.value = h; c.font = { name: FONT, size: 10.5 }; c.fill = xFill('FFD9E2F3'); c.border = xBorder; c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true, readingOrder: 'rtl' }; });
  hr.height = 34;
  rows.forEach((r, i) => { const row = ws.getRow(5 + i); r.forEach((v, k) => { const c = row.getCell(k + 1); c.value = v === '' || v == null ? null : v; c.font = { name: FONT, size: 10.5, color: opts.color ? opts.color(i, k) : undefined };
    c.border = xBorder; c.alignment = { horizontal: (opts.left || []).includes(k) ? 'right' : 'center', vertical: 'middle', wrapText: (opts.wrap || []).includes(k), readingOrder: 'rtl' };
    if (c.value == null && !(opts.noOrange || []).includes(k)) c.fill = xFill('FFFFC000'); if (opts.numFmt && opts.numFmt[k]) c.numFmt = opts.numFmt[k]; }); });

}

  await loadScript('exceljs.min.js');

  const H = ['رقم الأرشيف', 'الرقم التسلسلي', 'السنة الدراسية', 'القسم', 'التلميذ(ة)', 'رقم التسجيل', 'تاريخ الازدياد', 'مكان الازدياد', 'اسم الأب / الولي', 'هاتف الولي', 'الأستاذ(ة)', 'المادة / الصفة', 'سبب الاستدعاء', 'تاريخ الطلب', 'يوم الحضور', 'تاريخ الحضور', 'ساعة الحضور', 'الحالة', 'تاريخ قرار المدير', 'ملاحظة المدير', 'تاريخ الطباعة'];
  const W = [24, 9, 11, 30, 26, 10, 12, 14, 20, 24, 22, 17, 46, 17, 10, 12, 9, 10, 17, 22, 17];
  const order = { 'مقبول': 0, 'جديد': 1, 'مرفوض': 2 };
  const all = d.summons.slice().sort((a, b) => (order[a.status] - order[b.status]) || a.cid.localeCompare(b.cid) || ((a.serial || 999) - (b.serial || 999)) || a.at.localeCompare(b.at));
  const row = s => [s.archive, s.serial, s.year, s.cls, s.pupil, s.reg, dmy(s.dob), s.pob, s.father || s.wali, s.phone, s.teacher, s.role, s.reason, dmyhm(s.at), dayOf(s.date), dmy(s.date), s.time, s.status, dmyhm(s.decided), s.note, dmyhm(s.printed)];
  const opt = { left: [3, 4, 8, 10, 11, 12, 19], wrap: [12, 19], noOrange: [0, 1, 18, 19, 20], color: (i, k) => null };
  const stamp = `السنة الدراسية ${d.year} · استُخرج في ${dmyhm(new Date(Date.now() + 3600e3).toISOString().replace('T', ' ').slice(0, 16))}`;
  xTable(wb.addWorksheet('كل الاستدعاءات'), `سجل استدعاءات أولياء التلاميذ – ${SCHOOL_FULL}`, stamp, H, W, all.map(row), opt);
  for (const c of d.classes){
    const list = all.filter(s => s.cid === c.id); if (!list.length) continue;
    xTable(wb.addWorksheet(`${levelTag(c.level)} - ${c.group}`), `سجل استدعاءات ${c.label}`, stamp, H, W, list.map(row), opt);
  }
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ---------- الحضور الشهري: PDF و Excel ---------- */
function attPage(m){
  const d = inboxData, rows = attRows(m), sent = rows.filter(r => r.x), avg = sent.length ? sent.reduce((s, r) => s + r.x.rate, 0) / sent.length : null;
  return `<div class="page port">
    <div class="d-rep" style="text-align:center;font-size:16px">${REP}<br>وزارة التربية الوطنية</div>
    <div class="d-sch" style="margin-top:6px">مديرية التربية لولاية البليدة<br>${esc(SCHOOL_FULL)}</div>
    <div class="d-title" style="margin-top:14px;font-size:20px">جدول نسب الحضور والغياب الشهرية</div>
    <div class="d-sub" style="font-size:15px">شهر ${esc(monthName(m))} · السنة الدراسية ${esc(d.year)}</div>
    <table class="d-tbl2" style="margin-top:10px"><colgroup><col style="width:6%"><col style="width:33%"><col style="width:23%"><col style="width:12%"><col style="width:12%"><col style="width:14%"></colgroup>
      <thead><tr><th style="height:34px">الرقم</th><th>القسم</th><th>الأستاذ(ة)</th><th>نسبة الحضور</th><th>نسبة الغياب</th><th>تاريخ الإرسال</th></tr></thead>
      <tbody>${rows.map((r, k) => `<tr style="height:30px"><td>${k + 1}</td><td class="n">${esc(r.c.label)}</td><td class="n">${esc(r.x ? r.x.by : '')}</td><td><span class="lat">${r.x ? pct(r.x.rate) : ''}</span></td><td><span class="lat">${r.x ? pct(r.x.abs) : ''}</span></td><td style="font-size:11px">${r.x ? `<span class="lat">${esc(dmyhm(r.x.at))}</span>` : 'لم يُرسل'}</td></tr>`).join('')}
        <tr style="height:32px"><td colspan="3" class="calc">معدل المدرسة (${sent.length} من ${rows.length} أقسام)</td><td class="calc"><span class="lat">${avg == null ? '' : pct(avg)}</span></td><td class="calc"><span class="lat">${avg == null ? '' : pct(100 - avg)}</span></td><td class="calc"></td></tr></tbody></table>
    <div class="d-foot" style="margin-top:22px;font-size:14px"><span>حرر بأولاد يعيش في: ${esc(dmy(todayISO()))}</span><span>المدير(ة): ..............................</span></div>
  </div>`;
}
async function buildAttXLSX(m){
  await loadScript('exceljs.min.js');
  const d = inboxData, wb = new ExcelJS.Workbook(); wb.creator = 'منصة التقويم المستمر';
  const rows = attRows(m), sent = rows.filter(r => r.x), avg = sent.length ? sent.reduce((s, r) => s + r.x.rate, 0) / sent.length : null;
  const data = rows.map((r, k) => [k + 1, r.c.label, r.x ? r.x.by : '', r.x ? r.x.rate / 100 : '', r.x ? r.x.abs / 100 : '', r.x ? dmyhm(r.x.at) : '']);
  data.push(['', `معدل المدرسة (${sent.length} من ${rows.length} أقسام)`, '', avg == null ? '' : avg / 100, avg == null ? '' : (100 - avg) / 100, '']);
  xTable(wb.addWorksheet(MONTHS[m.slice(5)] + ' ' + m.slice(0, 4)), `جدول نسب الحضور والغياب – شهر ${monthName(m)}`, `${SCHOOL_FULL} · السنة الدراسية ${d.year}`,
    ['الرقم', 'القسم', 'الأستاذ(ة)', 'نسبة الحضور', 'نسبة الغياب', 'تاريخ الإرسال'], [7, 34, 24, 13, 13, 18], data, { left: [1, 2], portrait: true, noOrange: [0], numFmt: { 3: '0.00%', 4: '0.00%' } });
  const months = d.months, H = ['القسم'];
  months.forEach(mm => { H.push('حضور ' + MONTHS[mm.slice(5)], 'غياب ' + MONTHS[mm.slice(5)]); });
  const yr = d.classes.map(c => { const r = [c.label]; months.forEach(mm => { const x = (d.att[c.id] || {})[mm]; r.push(x ? x.rate / 100 : '', x ? x.abs / 100 : ''); }); return r; });
  const nf = {}; for (let k = 1; k < H.length; k++) nf[k] = '0.00%';
  xTable(wb.addWorksheet('الحصيلة السنوية'), 'الحصيلة السنوية لنسب الحضور والغياب', `${SCHOOL_FULL} · السنة الدراسية ${d.year}`, H, [30, ...months.flatMap(() => [10, 10])], yr, { left: [0], numFmt: nf });
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ---------- أحداث الإصدار 2 ---------- */
async function handleV2(act, a){
  if (act === 'retryAddf'){ viewAddLang(); return true; }
  if (act === 'rq'){ const ta = $('#smReason'); ta.value = (ta.value.trim() ? ta.value.trim() + '، ' : '') + a.dataset.t; a.setAttribute('aria-pressed', 'true'); return true; }
  if (act === 'attM'){ attSheet(+a.dataset.i, a.dataset.m); return true; }
  if (act === 'mineRetry'){ viewMine(); return true; }
  if (act === 'inboxRetry'){ viewInbox(curTab(), true); return true; }
  if (act === 'itab'){ history.replaceState(null, '', '#inbox-' + a.dataset.t); renderInbox(a.dataset.t); window.scrollTo(0, 0); return true; }
  if (act === 'ifil'){ inboxFilter = a.dataset.f; renderInbox('sum'); return true; }
  if (act === 'smOk'){ approveSheet(a.dataset.id); return true; }
  if (act === 'smNo'){ rejectSheet(a.dataset.id); return true; }
  if (act === 'smOpen'){ if (await summonAct(a.dataset.id, 'reopen')) renderInbox('sum'); return true; }
  if (act === 'smPrint'){ printSummons([a.dataset.id]); return true; }
  if (act === 'printAll'){ printSummons(inboxData.summons.filter(s => s.status === 'مقبول' && !s.printed).map(s => s.id)); return true; }
  if (act === 'sumXlsx'){ busy(true, 'جارٍ إعداد ملف Excel…'); try { const b = await buildSummonsXLSX(); busy(false); await saveBlob(b, `سجل_الاستدعاءات_${inboxData.year.replace('/', '-')}.xlsx`); } catch(e){ busy(false); console.error(e); toast('تعذّر إعداد الملف'); } return true; }
  if (act === 'attPdf'){ busy(true, 'جارٍ إعداد ملف PDF…'); try { const b = await renderPDF([attPage(attMonth)], false, 'نسب الحضور والغياب'); busy(false); await saveBlob(b, `الحضور_والغياب_${attMonth}.pdf`); } catch(e){ busy(false); console.error(e); toast('تعذّر إعداد الملف'); } return true; }
  if (act === 'attXlsx'){ busy(true, 'جارٍ إعداد ملف Excel…'); try { const b = await buildAttXLSX(attMonth); busy(false); await saveBlob(b, `الحضور_والغياب_${attMonth}.xlsx`); } catch(e){ busy(false); console.error(e); toast('تعذّر إعداد الملف'); } return true; }
  return false;
}

/* =========================================================
   الأحداث
   ========================================================= */
app.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const b = e.target.closest('[data-back]'); if (b){ back(b.dataset.back); return; }
  const st = e.target.closest('[data-step]'); if (st){ store.set('tq:step', +st.dataset.step); viewHome(); return; }
  const tm = e.target.closest('[data-term]'); if (tm){ viewDash(+tm.dataset.term); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'scan') return scanQR();
  if (act === 'theme') return toggleTheme();
  if (act === 'nav') return navTo(a.dataset.t);
  if (act === 'mail'){ const c = ctxOf(+a.dataset.i); if (c) mailSheet(c, c.lang || 'main'); return; }
  if (act === 'amail'){ const c0 = adminCtxCache[a.dataset.id], w = a.dataset.w || 'main', ad = adminOf(); if (c0 && ad) mailSheet({ ...c0, teacher: c0.teacherOf ? c0.teacherOf(w) : c0.teacher }, w, { id: a.dataset.id, api: ad.api, key: ad.key }); return; }
  if (act === 'install') return doInstall();
  if (act === 'noinstall'){ store.set('tq:noInstall', true); return viewHome(); }
  if (act === 'retry') return viewClass(+a.dataset.i);
  if (act === 'refresh'){ busy(true, 'جارٍ التحديث…'); try { await syncNow(classes[+a.dataset.i].k); await fetchClass(+a.dataset.i); busy(false); renderClass(+a.dataset.i); toast('تم التحديث'); } catch(err){ busy(false); toast(errText(err)); } return; }
  if (act === 'pdf' || act === 'xlsx') return exportCtx(ctxOf(+a.dataset.i), act);
  if (act === 'share-pdf' || act === 'share-xlsx') return exportCtx(ctxOf(+a.dataset.i), act.slice(6), true);
  if (act === 'apdf' || act === 'axlsx'){ const c0 = adminCtxCache[a.dataset.id], w = a.dataset.w || 'main'; return exportCtx({ ...c0, teacher: c0.teacherOf ? c0.teacherOf(w) : c0.teacher }, act.slice(1), false, w); }
  if (act === 'qrLang'){ const l = a.dataset.l; return showQR('أستاذ(ة) ' + LANGS[l].name, 'رمز واحد يفتح كل أقسام ' + LANGS[l].name + ' مع المادة وحدها', langLink(adminOf(), l)); }
  if (act === 'notifOn'){ try { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'ستصلك الإشعارات ما دامت اللوحة مفتوحة' : 'لم يُسمح بالإشعارات'); } catch(err){} return viewDash(); }
  if (await handleV2(act, a)) return;
  if (act === 'dashRefresh') return viewDash(dashData && dashData.term);
  if (act === 'setTerm'){ const ad = adminOf(); busy(true); try { const r = await api(ad.api, { action: 'setTerm', key: ad.key, term: +a.dataset.t }); if (!r.ok) throw r; busy(false); toast('تم تغيير الفصل الحالي'); viewDash(+a.dataset.t); } catch(err){ busy(false); toast(errText(err)); } return; }
  if (act === 'qrAll') return qrCardsPDF();
  if (act === 'qrOne'){ const c = dashData.classes.find(x => x.id === a.dataset.id); return showQR(c.label, 'يمسحه الأستاذ بكاميرا هاتفه فيفتح قسمه مباشرة', teacherLink(adminOf(), c)); }
  if (act === 'qrAdmin'){ const ad = adminOf(); return showQR('فتح لوحة المدير على الهاتف', 'امسح هذا الرمز بهاتفك. لا تشاركه مع أحد', `${appBase()}#admin=${encodeURIComponent(ad.key)}&${linkParamsFor(ad.api)}`); }
  if (act === 'adminOut'){ store.del('tq:admin'); dashData = null; location.replace(me ? '#home' : '#reg'); return; }
  if (!['confirm', 'tab', 'set', 'plus', 'minus', 'del'].includes(act) || !classes[+app.dataset.i]) return;

  // صب النقاط
  const i = +app.dataset.i, sid = app.dataset.sub;
  if (act === 'confirm') return confirmSave(i, sid);
  let ctx = ctxOf(i); if (!ctx) return;
  const sub = ctx.subjects.find(s => s.id === sid), items = itemsOf(sub);
  if (act === 'tab'){
    const d = +a.dataset.d; ui.tab[i + sid] = d;
    $('#tabs').innerHTML = tabsHTML(ctx, sub, d);
    $('#domNow').innerHTML = `${items[d].exam ? '' : 'الميدان: '}<b>${esc(items[d].n)}</b>`;
    $('#list').innerHTML = ctx.students.map((s, k) => cardHTML(ctx, k, s, items[d].f)).join('');
    $('#sum').innerHTML = sumHTML(ctx, sub, d);
    window.scrollTo({ top: 0, behavior: 'auto' });
    return;
  }
  const card = a.closest('.st'); if (!card) return;
  const s = card.dataset.s, d = Math.min(ui.tab[i + sid] || 0, items.length - 1), f = items[d].f, v = ctx.get(s, f), step = getStep();
  if (act === 'set'){ ctx = setMark(ctx, s, f, +a.dataset.v); buzz(); }
  else if (act === 'plus' && v != null) ctx = setMark(ctx, s, f, v + step);
  else if (act === 'minus' && v != null) ctx = setMark(ctx, s, f, v - step);
  else if (act === 'del' && v != null){
    ctx = setMark(ctx, s, f, null);
    const nm = ctx.students.find(x => x.id === s).n;
    toast(`حُذفت علامة ${nm}`, { label: 'تراجع', fn: () => { const c2 = setMark(ctxOf(i), s, f, v); if (location.hash === `#grade-${i}-${sid}`) refreshCard(c2, sub, d, s); } });
  }
  refreshCard(ctx, sub, d, s);
  const nb = app.querySelector(`.st[data-s="${CSS.escape(s)}"] [data-act="${act}"]`);
  if (nb && !nb.disabled && act !== 'set') nb.focus({ preventScroll: true });
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- start ---------- */
(function boot(){
  const h = location.hash;
  if (h.includes('=')){
    const p = parseParams(h);
    if (p.k){ const i = addClass(p.k, apiFromParams(p)); history.replaceState(null, '', location.pathname + (me ? '#cls-' + i : '#reg')); }
    else if (p.f){ store.set('tq:addf', { f: p.f, api: apiFromParams(p) }); history.replaceState(null, '', location.pathname + '#addf'); }
    else if (p.admin){ store.set('tq:admin', { api: apiFromParams(p), key: p.admin }); history.replaceState(null, '', location.pathname + '#dash'); }
  }
  themeMeta();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { themeMeta(); if (curView() === 'home' || curView() === 'reg') route(true); }); } catch(e){}
  route();
  classes.forEach(c => scheduleSync(c.k, 1500));
  if (!IS_ARTIFACT && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
