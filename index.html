/* One UI look: soft sky-blue surfaces, large rounded cards, coloured icon tiles, light and dark themes. Printed pages keep their own fixed colours. */
:root{
  --bg:#f0f7fb;--surface:#ffffff;--soft:#e8f3f8;--ink:#1e293b;--muted:#64748b;--line:#dbeafe;
  --accent:#38bdf8;--accent-ink:#0369a1;--accent-soft:rgba(56,189,248,.15);--on-accent:#020617;
  --ok:#15803d;--ok-fill:#22c55e;--ok-soft:rgba(34,197,94,.14);--warn:#b45309;--warn-soft:rgba(245,158,11,.16);--danger:#dc2626;--danger-soft:rgba(239,68,68,.12);
  --shadow:0 12px 35px -8px rgba(14,165,233,.09),0 4px 12px -2px rgba(0,0,0,.03);
  --ui:Tajawal,"Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --doc:"Khalid Art bold",Amiri,"Traditional Arabic","Times New Roman",serif;
  --radius:24px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b131d;--surface:#131c2e;--soft:#1b263d;--ink:#f8fafc;--muted:#94a3b8;--line:rgba(56,189,248,.16);
  --accent:#38bdf8;--accent-ink:#7dd3fc;--accent-soft:rgba(56,189,248,.16);--on-accent:#020617;
  --ok:#4ade80;--ok-fill:#22c55e;--ok-soft:rgba(34,197,94,.16);--warn:#fbbf24;--warn-soft:rgba(245,158,11,.16);--danger:#f87171;--danger-soft:rgba(239,68,68,.16);
  --shadow:0 12px 35px -8px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b131d;--surface:#131c2e;--soft:#1b263d;--ink:#f8fafc;--muted:#94a3b8;--line:rgba(56,189,248,.16);
  --accent:#38bdf8;--accent-ink:#7dd3fc;--accent-soft:rgba(56,189,248,.16);--on-accent:#020617;
  --ok:#4ade80;--ok-fill:#22c55e;--ok-soft:rgba(34,197,94,.16);--warn:#fbbf24;--warn-soft:rgba(245,158,11,.16);--danger:#f87171;--danger-soft:rgba(239,68,68,.16);
  --shadow:0 12px 35px -8px rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--ui);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;transition:background-color .25s}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}
svg.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.18em}
.lat{direction:ltr;unicode-bidi:isolate}

/* icon tiles */
.tile{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font:800 18px/1 var(--ui)}
.tile svg.ic{width:21px;height:21px}
.t-sky{background:rgba(56,189,248,.16);color:#0284c7}
.t-amber{background:rgba(245,158,11,.16);color:#d97706}
.t-emerald{background:rgba(16,185,129,.15);color:#059669}
.t-violet{background:rgba(139,92,246,.15);color:#7c3aed}
.t-rose{background:rgba(244,63,94,.13);color:#e11d48}
.t-indigo{background:rgba(99,102,241,.15);color:#4f46e5}
:root[data-theme="dark"] .t-sky{color:#38bdf8}:root[data-theme="dark"] .t-amber{color:#fbbf24}:root[data-theme="dark"] .t-emerald{color:#34d399}
:root[data-theme="dark"] .t-violet{color:#a78bfa}:root[data-theme="dark"] .t-rose{color:#fb7185}:root[data-theme="dark"] .t-indigo{color:#818cf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-sky{color:#38bdf8}:root:not([data-theme="light"]) .t-amber{color:#fbbf24}:root:not([data-theme="light"]) .t-emerald{color:#34d399}
  :root:not([data-theme="light"]) .t-violet{color:#a78bfa}:root:not([data-theme="light"]) .t-rose{color:#fb7185}:root:not([data-theme="light"]) .t-indigo{color:#818cf8}}

/* top bar of inner pages: compact title appears after scrolling past the large one */
.topbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s,background-color .2s}
body.scrolled .topbar,.topbar.solid{border-bottom-color:var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent)}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.bar .t{flex:1;min-width:0;opacity:0;transition:opacity .2s}
body.scrolled .bar .t,.topbar.solid .bar .t{opacity:1}
.bar .t h1{font:800 17px/1.35 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t p{font:500 12px/1.4 var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{max-width:720px;margin:0 auto;padding:6px 22px 14px}
.ttl h1{font:800 26px/1.3 var(--ui)}
.ttl p{font:500 13.5px/1.5 var(--ui);color:var(--muted);margin-top:3px}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);padding:0;box-shadow:0 2px 6px rgb(0 0 0 / .04)}
.icon-btn svg.ic{width:18px;height:18px}
.sync{font:800 11.5px var(--ui);display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);background:var(--soft);padding:7px 11px;border-radius:12px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok);background:var(--ok-soft)}.sync.busy{color:var(--accent-ink);background:var(--accent-soft)}.sync.off{color:var(--warn);background:var(--warn-soft)}
.sync:empty{display:none}

/* home header */
.head{position:relative;max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(14px + env(safe-area-inset-top)) 22px 6px}
.head .theme{position:absolute;left:18px;top:calc(14px + env(safe-area-inset-top))}
.logo{width:104px;height:104px;border-radius:50%;background:#fff;border:2px solid rgba(56,189,248,.3);box-shadow:0 14px 28px -10px rgba(14,165,233,.4);display:grid;place-items:center;padding:7px;margin-bottom:12px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.head .rep{font:700 12px var(--ui);color:var(--muted)}
.head .sch{font:800 25px/1.3 var(--ui);margin-top:2px}
.lift{margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel.glow::after{content:"";position:absolute;left:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:var(--accent);opacity:.15;filter:blur(26px);pointer-events:none}
.panel>*{position:relative;z-index:1}
.wel{font:500 13.5px var(--ui);color:var(--muted)}
.hello{font:800 24px/1.35 var(--ui)}
.hello b{color:var(--accent-ink)}
.lbl{font:700 12px var(--ui);color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:700 12.5px var(--ui);padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:10px 18px;border-radius:18px;border:1px solid var(--line);background:var(--soft);font:700 15px var(--ui);text-decoration:none;color:inherit;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg.ic{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 10px 22px -10px rgba(14,165,233,.65)}
.btn.big{min-height:56px;font-size:16.5px;width:100%}
.btn.small{min-height:40px;padding:6px 13px;font-size:13.5px;border-radius:14px}
.btn.ok{background:var(--ok-fill);border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(34,197,94,.65)}
.btn.xl{background:#16a34a;border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(34,197,94,.65)}
.btn.ghost{background:var(--surface)}
.btn.ghost svg.ic,.btn:not(.primary):not(.ok):not(.xl) svg.ic{color:var(--accent-ink)}
.btn.link{background:transparent;border-color:transparent;color:var(--muted);min-height:40px;font-size:13.5px}
.btn.danger-t{color:var(--danger);background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5}

.sec{margin-top:22px;display:grid;gap:12px}
.sec>h2{font:800 14px var(--ui);color:var(--muted);padding:0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font:800 11.5px var(--ui);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill svg.ic{width:12px;height:12px}
.pill.draft{background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog.full i{background:var(--ok-fill)}
.meta{font:500 12.5px var(--ui);color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-height:48px;font-size:14.5px}

/* grouped list of classes */
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:var(--shadow)}
.class-item{text-align:start;width:100%;background:transparent;border:0;border-radius:22px;padding:12px;display:flex;align-items:center;gap:13px}
.class-item+.class-item{border-top:1px solid var(--line);border-radius:0 0 22px 22px}
.class-item .tile{font-size:16px}
.class-item h3{font:800 15.5px/1.4 var(--ui)}
.class-item p{font:500 12px/1.4 var(--ui);color:var(--muted);margin-top:2px}
.class-item>svg.ic{width:14px;height:14px;color:var(--muted)}

/* request tiles */
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reqbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px 14px;display:flex;flex-direction:column;gap:9px;text-align:start;position:relative;box-shadow:var(--shadow);min-height:132px}
.reqbtn b{font:800 15px/1.35 var(--ui)}
.reqbtn small{font:500 11.5px/1.5 var(--ui);color:var(--muted)}
.reqbtn .go{position:absolute;left:14px;top:18px;color:var(--muted);width:13px;height:13px}
.reqbtn.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.reqbtn>span:not(.tile){display:flex;flex-direction:column;gap:3px}
.reqbtn.wide>span:not(.tile){flex:1}
.reqbtn.wide .go{position:static}
.nb{position:absolute;top:10px;left:34px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font:800 12px/22px var(--ui);text-align:center}

/* settings */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:6px;border-radius:18px;border:1px solid var(--line);width:100%}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:13px;font:700 14px var(--ui);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 6px 14px -6px rgba(14,165,233,.7)}
.setting{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.setting p{font:800 15px var(--ui)}
.setting small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.install-card{background:linear-gradient(90deg,var(--soft),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.install-card p{flex:1;font:700 13.5px/1.5 var(--ui)}
.install-card p small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.install-card .icon-btn{border:0;box-shadow:none;background:transparent;color:var(--muted)}
.foot{padding:20px 0 30px;text-align:center;display:grid;gap:4px;justify-items:center}
.safe{padding:12px 14px;border-radius:16px;background:var(--ok-soft);font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.safe svg.ic{margin-top:3px;color:var(--ok)}
.note{padding:11px 14px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font:600 13px/1.6 var(--ui);display:flex;gap:9px;align-items:flex-start}
.note svg.ic{margin-top:3px}
.form{display:grid;gap:16px}
.fld{display:grid;gap:8px;font:800 13.5px var(--ui);align-content:start}
.fld small{color:var(--muted);font-weight:500;font-size:11.5px;line-height:1.5}
.fld .err{color:var(--danger);font:700 12.5px var(--ui)}
input[type=text],input[type=tel],input[type=url],input[type=password],textarea,select,input[type=date],input[type=time],input[type=number]{width:100%;min-height:52px;border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 14px;font:500 16px var(--ui);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.ltr{direction:ltr;text-align:left}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.greet{border-radius:20px;padding:16px;background:var(--accent-soft);color:var(--accent-ink);font:800 22px/1.4 var(--ui);text-align:center}

/* bottom navigation */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.bnav .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-around}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 10.5px var(--ui);color:var(--muted);padding:7px 14px;border-radius:16px;min-width:66px}
.bnav button svg.ic{width:19px;height:19px}
.bnav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
body.has-nav #app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.has-nav .toast{bottom:calc(96px + env(safe-area-inset-bottom))}

/* subject cards */
.subj{text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.subj .h{display:flex;align-items:center;gap:12px}
.subj .tile{width:44px;height:44px;border-radius:15px;font-size:19px}
.subj h3{font:800 16px var(--ui);flex:1}
.tbl-card{display:flex;gap:13px;align-items:center}
.tbl-card h3{font:800 15px var(--ui)}
.tbl-card p{font:500 12px/1.5 var(--ui);color:var(--muted);margin-top:2px}

/* grading */
.tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:2px 14px 12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 3px 7px;font:800 11.5px/1.3 var(--ui);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;min-height:66px;text-align:center}
.tab.exam{border-style:dashed;border-color:var(--warn)}
.tab .cnt{font:800 11px var(--ui);padding:0 7px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tab.full .cnt{background:var(--ok-soft);color:var(--ok)}
.tab[aria-selected="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 16px -8px rgba(14,165,233,.8)}
.tab[aria-selected="true"] .cnt{background:rgba(255,255,255,.55);color:var(--on-accent)}
.dom-now{max-width:720px;margin:0 auto 4px;padding:0 14px}
.dom-now span{display:block;padding:10px 14px;border-radius:16px;background:var(--soft);font:500 13px var(--ui);color:var(--muted)}
.dom-now b{color:var(--ink);font-weight:800}
.list{max-width:720px;margin:0 auto;padding:8px 14px calc(116px + env(safe-area-inset-bottom));display:grid;gap:10px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px 13px;display:grid;gap:11px;box-shadow:var(--shadow)}
.st.done{border-color:rgba(34,197,94,.4)}
.st-head{display:flex;align-items:center;gap:10px}
.num{width:30px;height:30px;flex:none;border-radius:10px;background:var(--soft);display:grid;place-items:center;font:800 13px var(--ui);color:var(--muted)}
.name{flex:1;min-width:0;font:800 16px/1.4 var(--ui)}
.badge{min-width:54px;height:38px;padding:0 8px;border-radius:13px;display:grid;place-items:center;font:800 18px var(--ui);background:var(--accent);color:var(--on-accent);flex:none}
.badge.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:700}
.icon-btn.del{color:var(--danger);background:var(--danger-soft);border-color:transparent;box-shadow:none;width:40px;height:40px;border-radius:13px}
.icon-btn.del:disabled{opacity:.35}
.st-body{display:flex;gap:8px;align-items:stretch}
.keys{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.key{height:44px;border-radius:12px;border:0;background:var(--soft);font:800 17px var(--ui);padding:0}
.key:active{transform:scale(.95)}
.key.on{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 12px -6px rgba(14,165,233,.85)}
.step{display:grid;grid-template-rows:1fr 1fr;gap:6px;width:50px;flex:none}
.step button{border-radius:12px;border:1px solid var(--line);background:var(--surface);font:800 22px/1 var(--ui);padding:0;color:var(--accent-ink)}
.step button:disabled{opacity:.4}
@media (min-width:560px){.keys{grid-template-columns:repeat(10,minmax(0,1fr))}.step{grid-template-rows:none;grid-template-columns:1fr 1fr;width:110px}}
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 24px -14px rgba(14,165,233,.35)}
.bottombar .in{max-width:720px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.bottombar .sum{flex:1;font:500 12.5px/1.55 var(--ui);color:var(--muted)}
.bottombar .sum b{color:var(--ink);font-size:14px;font-weight:800}
.bottombar .btn{min-height:50px}

/* export + preview */
.exp{padding:4px 0 40px;display:grid;gap:14px}
.exp>*,#pv,.pv{min-width:0}
.pv{overflow:hidden;border-radius:8px;box-shadow:0 1px 0 var(--line),0 6px 18px rgb(19 32 46 / .12);background:#fff}
.pv>.page{transform-origin:top right}
.miss{margin:0;padding:0 18px 0 0;font-size:13px;color:var(--muted)}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt .btn{flex-direction:column;gap:5px;padding:14px 8px;min-height:84px}
.fmt .btn svg.ic{width:23px;height:23px;color:inherit!important}
.fmt .btn small{font:600 11px var(--ui);opacity:.8}
.mailbox{border:1.5px solid rgba(139,92,246,.35)}
.mailbox h3{font:800 15.5px var(--ui)}
.mailbox p{font:500 12.5px/1.55 var(--ui)}
.sent{display:flex;gap:8px;align-items:center;font:700 12.5px var(--ui);color:var(--ok);background:var(--ok-soft);border-radius:14px;padding:9px 12px}
.files{display:grid;gap:8px}
.files div{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font:700 13px var(--ui);word-break:break-all}
.files svg.ic{width:20px;height:20px}
.files .p{color:#dc2626}.files .x{color:#16a34a}

/* overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(2 6 23 / .55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:grid;align-items:end;justify-items:center;padding:10px}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:32px;padding:12px 20px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgb(0 0 0 / .25)}
.sheet::before{content:"";width:44px;height:5px;border-radius:5px;background:var(--line);justify-self:center}
.sheet h2{font:800 19px var(--ui)}
.sheet h3{font:800 14.5px var(--ui);margin-top:4px}
.sheet ol{margin:0;padding:0 20px 0 0;display:grid;gap:4px;font-size:14px}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.dl{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.dl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:15px;background:var(--soft);font:700 13.5px var(--ui)}
.dl li b{font-weight:800;display:inline-flex;gap:5px;align-items:center}
.dl li.ok b{color:var(--ok)}
.dl li.warn b{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:18px;padding:11px 16px;display:flex;align-items:center;gap:14px;font:700 14px var(--ui);max-width:calc(100% - 32px);box-shadow:0 14px 30px -10px rgb(2 6 23 / .45)}
.toast button{background:transparent;border:0;color:var(--accent);font:800 14px var(--ui);padding:4px 2px}
.busy{position:fixed;inset:0;z-index:70;background:rgb(2 6 23 / .45);display:grid;place-items:center}
.busy div{background:var(--surface);padding:18px 22px;border-radius:20px;font:700 15px var(--ui);display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.key:active,.btn:active{transform:none}}

/* summons, attendance, requests */
.qchips{display:flex;flex-wrap:wrap;gap:7px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:700 13px var(--ui)}
.qchip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font:700 12.5px var(--ui);color:var(--ok)}
.hint.bad{color:var(--danger)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:grid;gap:9px;box-shadow:var(--shadow)}
.item h3{font:800 15.5px/1.4 var(--ui)}
.item .q{font-size:13.5px;background:var(--soft);border-radius:14px;padding:9px 12px;white-space:pre-wrap;line-height:1.55}
.item .m{font:500 12.5px var(--ui);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.item .m span{display:inline-flex;gap:6px;align-items:center}
.item .m svg.ic{width:12px;height:12px}
.item .m a{color:var(--accent-ink);font-weight:700;text-decoration:none}
.tabs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tabs2 button{justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;font:800 13.5px var(--ui);display:flex;gap:6px;align-items:center}
.tabs2 button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.tabs2 .c{min-width:20px;height:20px;border-radius:99px;background:var(--danger);color:#fff;font:800 11.5px/20px var(--ui);text-align:center;padding:0 5px}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mon{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:13px;text-align:start;display:grid;gap:3px;box-shadow:var(--shadow);align-content:start}
.mon b{font:800 14.5px var(--ui);display:flex;justify-content:space-between;align-items:center}
.mon b svg.ic{width:16px;height:16px}
.mon span{font:500 12px/1.5 var(--ui);color:var(--muted)}
.mon.done{border-color:rgba(34,197,94,.4)}
.mon.done b svg.ic{color:var(--ok)}
.mon.now{border:2px solid var(--accent);box-shadow:0 10px 24px -12px rgba(14,165,233,.6)}
.mon.now b svg.ic{color:var(--accent-ink)}
.mon .pc{font-weight:800;direction:ltr;unicode-bidi:isolate}
.mon .pc.p{color:var(--ok)}.mon .pc.a{color:var(--warn)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate div{padding:12px;border-radius:18px;background:var(--soft);display:grid;gap:4px}
.rate span{font:700 11.5px var(--ui);color:var(--muted)}
.big-num{font:800 28px var(--ui);direction:ltr;unicode-bidi:isolate;text-align:start}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 6px;text-align:center}
.tbl th{background:var(--accent-soft);color:var(--accent-ink);font-weight:800}
.tbl td.l{text-align:start}
.tbl tr.miss td{background:var(--warn-soft)}
.tbl tr.avg td{font-weight:800}
.scrollx{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
.notif{background:var(--surface);border:1.5px solid var(--warn);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.notif.calm{border-color:var(--line)}

/* admin */
.ac{display:grid;gap:10px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.mini .prog{height:6px}
.qrbig{display:grid;justify-items:center;gap:8px}
.qrbig img{width:230px;height:230px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:14px}
.linkbox{direction:ltr;font:600 11.5px/1.5 ui-monospace,monospace;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;word-break:break-all;color:var(--muted)}

/* printable pages */
.page{background:#fff;color:#000;font-family:var(--doc);font-weight:700;direction:rtl;position:relative}
.page.land{width:1123px;height:794px;padding:30px 40px}
.page.port{width:794px;height:1123px;padding:48px 46px}
.page .d-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.page .d-rep{text-align:center;font-size:16px;line-height:1.35;grid-column:2}
.page .d-sch{font-size:13.5px;line-height:1.4;margin-top:2px}
.page .d-title{text-align:center;font-size:18px;line-height:1.4}
.page .d-sub{text-align:center;font-size:13.5px;line-height:1.4;margin:0 0 8px}
.page table{width:100%;border-collapse:collapse;table-layout:fixed}
.page th,.page td{border:1px solid #000;text-align:center;vertical-align:middle;padding:0 3px}
.page th{background:#d9e2f3;font-size:11px;line-height:1.25}
.page th.sb{font-size:13.5px;height:22px}
.page th.lv2{font-size:11.5px;height:20px}
.page th.dm{height:46px}
.page td{font-size:11px;line-height:1.05;padding-top:0;padding-bottom:1px}
.page td.n{text-align:right;padding-right:5px}
.page td.calc{background:#f1f4f9}
.page .d-foot{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.page .d-pg{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;color:#555}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:14px;height:100%}
.qrcard{border:1.5px dashed #888;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.qrcard .s{font-size:12px;color:#333}
.qrcard .c{font-size:17px;line-height:1.3}
.qrcard img{width:150px;height:150px;image-rendering:pixelated}
.qrcard .h{font-size:11.5px;color:#333}
#printRoot{position:absolute;left:-14000px;top:0}

/* printed summons: A4 portrait cut in two */
.smn{font-family:var(--doc);font-weight:400;color:#111;font-size:12.5pt;line-height:1.55;direction:rtl}
.smn .lat{font-family:DocSerif,"Times New Roman",serif;font-weight:700;direction:ltr;unicode-bidi:isolate}
.smn .half{height:148.5mm;padding:7mm 12mm 6mm;position:relative}
.smn .frame{height:100%;border:1.6pt solid #1f3b63;padding:2.2mm}
.smn .inner{height:100%;border:.6pt solid #1f3b63;padding:3.5mm 5mm 3mm;display:flex;flex-direction:column}
.smn .rep{text-align:center;font-size:12pt;line-height:1.35}
.smn .rep b{font-size:13pt;font-weight:400}
.smn .hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-top:1.2mm;font-size:11pt;line-height:1.45}
.smn .hdr .l{text-align:left}
.smn .badge2{display:inline-block;border-radius:2mm;padding:0 2.5mm;background:#1f3b63;color:#fff;font-size:10.5pt}
.smn h1{text-align:center;font-size:21pt;font-weight:400;color:#1f3b63;margin:1.5mm 0 2mm;line-height:1.25}
.smn .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm;row-gap:.6mm;font-size:12pt}
.smn .f{display:flex;gap:1.5mm;align-items:baseline;white-space:nowrap;overflow:hidden}
.smn .f .k{color:#333;flex:none}
.smn .f .v{flex:1;border-bottom:.6pt dotted #777;padding:0 1mm;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.smn .full{grid-column:1/-1}
.smn .txt{margin-top:2mm;text-align:justify}
.smn .blank{display:inline-block;min-width:24mm;border-bottom:.6pt dotted #555;text-align:center;padding:0 1mm}
.smn .note{margin-top:2.5mm;font-size:11pt;color:#444;background:none;padding:0}
.smn .sig{display:flex;justify-content:space-between;align-items:flex-start;margin-top:auto;font-size:11.5pt}
.smn .sig .box{text-align:center;min-width:52mm}
.smn .reason{border:1pt solid #b4472a;border-radius:1.5mm;padding:1mm 3mm 1.2mm;margin-top:1.6mm;background:#fdf3ef}
.smn .reason .t{color:#b4472a;font-size:11.5pt}
.smn .meta2{display:flex;gap:2mm;justify-content:space-between;font-size:10pt;margin-top:1.4mm}
.smn .meta2 span{border:.6pt solid #9aa9bf;border-radius:1.2mm;padding:0 2mm;background:#f2f5fa}
.smn .follow{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm;font-size:11.5pt;margin-top:1.4mm}
.smn .sig3{display:flex;justify-content:space-between;margin-top:auto;font-size:11pt;text-align:center}
.smn .sig3 div{flex:1}
.smn .cut{position:absolute;left:0;right:0;top:148.5mm;height:0;border-top:1pt dashed #555}
.smn .cut span{position:absolute;top:-3.2mm;left:50%;transform:translateX(-50%);background:#fff;padding:0 3mm;font-size:10pt;color:#555;white-space:nowrap}
.page.port.smn{padding:0}

/* Latin documents (French / English) */
.page.ltrdoc{direction:ltr;font-family:DocSerif,"Times New Roman",serif;font-weight:700}
.page.ltrdoc .d-rep,.page.ltrdoc .d-title,.page.ltrdoc .d-sub{text-align:center}
.page.ltrdoc td.n{text-align:left;padding-left:6px;padding-right:0;font-size:11.5px;white-space:nowrap;overflow:hidden}
.page.ltrdoc .d-note{font-size:11px;font-weight:400;margin-top:8px;line-height:1.4}
.page .d-tbl2 th{font-size:12px}
.page .d-tbl2 td{font-size:12.5px}
.page .lat{font-family:DocSerif,"Times New Roman",serif;font-weight:700;direction:ltr;unicode-bidi:isolate}
/* v4: جدول الغيابات حسب المواد في التطبيق */
.tbl.att4 td{min-width:66px;line-height:1.3;vertical-align:middle}
.tbl.att4 td small{display:block;font:500 10.5px/1.35 var(--ui);color:var(--muted);max-width:120px;margin-inline:auto;white-space:normal}
.tbl td.miss{background:var(--warn-soft)}
.tbl td.na{color:var(--muted);background-color:var(--soft);background-image:linear-gradient(135deg,transparent 25%,var(--line) 25%,var(--line) 50%,transparent 50%,transparent 75%,var(--line) 75%);background-size:10px 10px}
.tbl td.avg{font-weight:800;background:var(--soft)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:600 12px var(--ui);color:var(--muted)}
.legend i{display:inline-block;width:18px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-inline-end:6px}
.legend .lg-miss{background:var(--warn-soft)}
.legend .lg-na{background-color:var(--soft);background-image:linear-gradient(135deg,transparent 25%,var(--line) 25%,var(--line) 50%,transparent 50%,transparent 75%,var(--line) 75%);background-size:6px 6px}

/* v4: القوائم */
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;font:700 15px var(--ui);color:inherit;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.prow .no{min-width:28px;height:28px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
.prow .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.prow .ck svg.ic{width:13px;height:13px}
.prow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prow[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prow:disabled{opacity:.8}
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 26px -12px rgba(0,0,0,.18)}
.sendbar span{font:800 14.5px var(--ui)}
.sendbar .btn{min-width:56%}
.btn.wa{background:#25d366;color:#fff;border-color:transparent}
.item.wait{border-color:var(--warn)}
ol.names{margin:0;padding-inline-start:22px;font:600 13.5px/1.75 var(--ui);columns:2;column-gap:18px}
.nb2{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font:800 11.5px/1 var(--ui);vertical-align:2px}

/* v4: الجدول الشهري للغيابات (A4 أفقي) والقوائم (A4 عمودي) */
.page.attp{padding:34px 42px 30px;display:flex;flex-direction:column;font-weight:400}
.attp .rep,.lstp .rep{text-align:center;font-size:17px;line-height:1.35}
.attp .hdr,.lstp .hdr{display:flex;justify-content:space-between;align-items:flex-end;font-size:14.5px;line-height:1.45;margin-top:3px}
.attp .hdr .l,.lstp .hdr .l{text-align:left}
.attp h1,.lstp h1{text-align:center;font-size:22px;font-weight:400;margin:9px 0 0;line-height:1.3}
.attp .sub,.lstp .sub{text-align:center;font-size:16px;margin:0 0 9px}
.attp th,.attp td{border:1px solid #000;padding:0 4px}
.attp thead th{background:#d9e2f3;font-weight:400;font-size:14px;line-height:1.2}
.attp thead tr.g th{font-size:15px;height:30px}
.attp thead tr.s th{font-size:12.5px;height:26px}
.attp tbody td{font-size:14px;line-height:1.15;padding-bottom:0}
.attp td.cls{text-align:right;padding-right:7px;font-size:14.5px}
.attp td.t{text-align:right;padding-right:6px;font-size:12.5px}
.attp td.na,.attp i.hatch{color:#777;background-color:#eceff3;background-image:linear-gradient(135deg,transparent 25%,#dbe0e7 25%,#dbe0e7 50%,transparent 50%,transparent 75%,#dbe0e7 75%);background-size:12px 12px}
.attp td.miss{background:#ffc000}
.attp td.avg{background:#f1f4f9}
.attp tr.pre td{background-color:#fbf7ef}
.attp tr.pre td.na{background-color:#eceff3}
.attp tr.lvl td{border-top:2px solid #000}

}

   المزامنة: كل ضغطة تُحفظ في الهاتف فوراً ثم تُرسل إلى الجدول
   ========================================================= */
const syncState = {};
let syncTimers = {}, syncing = {};
function setSync(k, s){
  syncState[k] = s;
  const el = $('#syncFlag');
  if (el && el.dataset.k === k){
    el.className = 'sync ' + ({ ok: 'ok', busy: 'busy', pending: 'busy', off: 'off' }[s] || '');
    el.textContent = { ok: 'محفوظ في الجدول', busy: 'جارٍ الإرسال…', pending: 'جارٍ الإرسال…', off: 'محفوظ في الهاتف، سيُرسل لاحقاً' }[s] || '';
  }
}
function scheduleSync(k, ms = 1200){ clearTimeout(syncTimers[k]); syncTimers[k] = setTimeout(() => syncNow(k), ms); }
const hasPend = k => [1, 2, 3].some(t => Object.keys(pendOf(k, t).items).length);
async function syncNow(k){
  const c = cacheOf(k), entry = classes.find(x => x.k === k);
  if (!c || !entry) return false;
  if (syncing[k]) return null;
  syncing[k] = true;
  try {
    for (const t of [1, 2, 3]){
      const p = pendOf(k, t), keys = Object.keys(p.items);
      if (!keys.length) continue;
      setSync(k, 'busy');
      const sent = { ...p.items };
      const changes = keys.map(key => { const [s, f] = key.split('|'); return { s, f, v: sent[key] }; });
      const r = await api(entry.api, { action: 'save', k, term: t, t: me, changes });
      if (!r || !r.ok) throw r || new Error('save_failed');
      const cc = cacheOf(k), p2 = pendOf(k, t);
      if (cc && cc.term === t){
        keys.forEach(key => { const [s, f] = key.split('|'); cc.marks[s] = cc.marks[s] || {}; if (sent[key] == null) delete cc.marks[s][f]; else cc.marks[s][f] = sent[key]; });
        setCache(k, cc);
      }
      keys.forEach(key => { if (p2.items[key] === sent[key]) delete p2.items[key]; });
      setPend(k, t, p2);
    }
    const left = [1, 2, 3].some(t => Object.keys(pendOf(k, t).items).length);
    setSync(k, left ? 'pending' : 'ok');
    if (left) scheduleSync(k, 600);
    return !left;
  } catch(e){
    setSync(k, 'off');
    scheduleSync(k, 20000);
    return false;
  } finally { syncing[k] = false; }
}
window.addEventListener('online', () => classes.forEach(c => scheduleSync(c.k, 300)));

/* ---------- class data ---------- */
async function fetchClass(i){
  const entry = classes[i];
  const r = await api(entry.api, { action: 'class', k: entry.k, t: me });
  if (!r || !r.ok) throw r;
  const old = cacheOf(entry.k);
  r.edited = (old && old.term === r.term && old.edited) || {};
  setCache(entry.k, r);
  entry.label = r.cls.label; entry.n = r.students.length; saveClasses();
  return r;
}
function ctxOf(i){
  const entry = classes[i], c = cacheOf(entry.k);
  if (!c) return null;
  const p = pendOf(entry.k, c.term).items;
  const allowed = c.allowed || CLASS_SUBS;
  return {
    k: entry.k, i, c, term: c.term, year: c.year, school: c.school || SCHOOL_DEFAULT, cls: c.cls, students: c.students,
    kind: c.kind || 'class', lang: c.lang || '', allowed, code: c.code || (c.lang ? c.lang : c.kind === 'pe' ? 'pe' : 'ar'),
    subjects: subjectsFor(c.cls.level).filter(s => allowed.includes(s.id)), teacher: me ? me.name : '',
    get(sid, f){ const key = sid + '|' + f; if (key in p) return p[key]; const m = c.marks[sid]; return m && m[f] != null ? m[f] : null; }
  };
}
function setMark(ctx, sid, f, v){
  const val = v == null ? null : Math.min(10, Math.max(0, round2(v)));
  const p = pendOf(ctx.k, ctx.term); p.items[sid + '|' + f] = val; setPend(ctx.k, ctx.term, p);
  const c = cacheOf(ctx.k), sub = ctx.subjects.find(s => itemsOf(s).some(it => it.f === f));
  if (c && sub && c.confirms && c.confirms[sub.id]){ c.edited = c.edited || {}; c.edited[sub.id] = true; setCache(ctx.k, c); }
  setSync(ctx.k, 'pending'); scheduleSync(ctx.k);
  return ctxOf(ctx.i);
}
function stats(ctx, sub){
  const items = itemsOf(sub), n = ctx.students.length;
  let filled = 0; const per = items.map(it => { const f = ctx.students.reduce((a, s) => a + (ctx.get(s.id, it.f) != null ? 1 : 0), 0); filled += f; return f; });
  return { filled, needed: n * items.length, per, n };
}
function subStatus(ctx, sub){
  const c = ctx.c, cf = c.confirms && c.confirms[sub.id], ed = c.edited && c.edited[sub.id];
  if (cf && !ed) return { cls: 'ok', txt: 'مؤكد' };
  if (cf && ed) return { cls: 'warn', txt: 'عُدّل بعد التأكيد' };
  return { cls: 'draft', txt: stats(ctx, sub).filled ? 'مسودة' : 'لم يبدأ' };
}
function caAvg(ctx, sid, sub){
  const v = sub.domains.map(d => ctx.get(sid, d.f));
  return v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0) / v.length;
}
function subjAvg(ctx, sid, sub){
  const ca = caAvg(ctx, sid, sub), ex = ctx.get(sid, sub.exam);
  return ca == null || ex == null ? null : (ca + ex) / 2;
}

function handleLink(text){
  const h = String(text || '').split('#')[1] || '';
  const p = parseParams(h);
  if (p.k){ const i = addClass(p.k, apiFromParams(p)); toast('تمت إضافة القسم'); go(me ? 'cls-' + i : 'reg'); return true; }
  if (p.f){ store.set('tq:addf', { f: p.f, api: apiFromParams(p) }); go('addf'); return true; }
  if (p.admin){ store.set('tq:admin', { api: apiFromParams(p), key: p.admin }); go('dash'); return true; }
  toast('هذا الرمز لا يخص المنصة'); return false;
}
async function scanQR(){
  const canScan = 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && !IS_ARTIFACT;
  if (!canScan){
    sheet(`<h2>مسح رمز القسم</h2><ol><li>افتح كاميرا الهاتف ووجّهها نحو رمز QR الخاص بقسمك.</li><li>اضغط على الرابط الذي يظهر فوق الرمز.</li><li>سيفتح القسم مباشرة في التطبيق.</li></ol>
      <div class="acts"><button class="btn primary" type="button" data-close="1">حسناً</button></div>`);
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch(e){ toast('لم يُسمح باستعمال الكاميرا'); return; }
  const box = sheet(`<h2>وجّه الكاميرا نحو رمز القسم</h2><video id="scanV" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover"></video>
    <div class="acts"><button class="btn" type="button" data-close="1">إلغاء</button></div>`);
  const v = box.querySelector('#scanV'); v.srcObject = stream;
  const stop = () => stream.getTracks().forEach(t => t.stop());
  try { await v.play(); } catch(e){}
  const det = new BarcodeDetector({ formats: ['qr_code'] });
  while (document.body.contains(v)){
    try { const r = await det.detect(v); if (r.length){ stop(); closeSheet(); handleLink(r[0].rawValue); return; } } catch(e){}
    await new Promise(r => setTimeout(r, 250));
  }
  stop();
}

function go(h){ depth++; location.hash = h; }
function back(fallback){ if (depth > 0){ depth--; history.back(); } else { location.replace('#' + fallback); } }
function parseParams(h){ const o = {}; String(h || '').replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; }
function addClass(k, apiUrl){
  let i = classes.findIndex(c => c.k === k);
  if (i < 0){ classes.push({ k, api: apiUrl || (classes[0] && classes[0].api) || store.get('tq:api') }); i = classes.length - 1; }
  else if (apiUrl) classes[i].api = apiUrl;
  if (apiUrl) store.set('tq:api', apiUrl);
  saveClasses();
  return i;
}
function route(keep){
  const h = location.hash.replace('#', '');
  const [v, a, b] = h.split('-');
  closeSheet();
  if (keep !== true){ window.scrollTo(0, 0); document.body.classList.remove('scrolled'); }
  document.body.classList.remove('has-nav');
  stopPoll();
  if (v === 'admin') return viewAdminLogin();
  if (v === 'dash') return viewDash();
  if (v === 'acls') return viewAcls();
  if (v === 'aexp') return viewAdminExport(h.slice(5));
  if (v === 'inbox') return viewInbox(a || 'sum');
  if (v === 'lists') return viewLists();
  if (v === 'alist') return viewAList(h.slice(6));
  if (v === 'teachers') return viewTeachers();
  if (v === 'aset') return viewASet();
  if (v === 'addf') return viewAddLang();
  if (!me || v === 'reg') return viewReg();
  if (v === 'cls' && classes[+a]) return viewClass(+a);
  if (v === 'grade' && classes[+a]) return viewGrade(+a, b);
  if (v === 'exp' && classes[+a]) return viewExport(+a);
  if (v === 'sum' && classes[+a]) return viewSummon(+a);
  if (v === 'att' && classes[+a]) return viewAttendance(+a);
  if (v === 'cert' && classes[+a]) return viewCert(+a);
  if (v === 'pick') return viewPick(a);
  if (v === 'mine') return viewMine(a);
  if (v === 'ntf') return viewNtf();
  if (v === 'tlists') return viewTLists();
  if (v === 'me') return viewMe();
  if (v === 'list') return viewListRoute(h.slice(5));
  return viewHome();
}
window.addEventListener('hashchange', () => route());

const isDark = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); };
function themeMeta(){ const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', isDark() ? '#0b1220' : '#f6f8fb'); }
function toggleTheme(){
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); store.set('tq:theme', t); themeMeta();
  const b = $('#themeBtn'); if (b){ b.innerHTML = isDark() ? I.sun : I.moon; b.setAttribute('aria-label', isDark() ? 'الوضع الفاتح' : 'الوضع الداكن'); }
}

function topbar(title, sub, parent, extra = ''){

    <div class="t"><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${extra}
  </div></header><div class="ttl"><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>`;

    <button class="btn primary big" type="submit">${I.check}دخول</button>
    <p class="safe">${I.lock}<span>يُستعمل اسمك ورقمك لتسجيل من صبّ النقاط في جدول المدرسة فقط.</span></p>

  <div class="foot"><a class="btn link" href="#admin">${I.admin}دخول الناظر</a></div></div>`;

  nm.addEventListener('input', upd); upd();
  ph.addEventListener('input', () => { $('#ePhone').hidden = true; });

async function viewClass(i){
  const entry = classes[i];
  let c = cacheOf(entry.k);
  if (!c){
    app.innerHTML = `${topbar('جارٍ التحميل…', '', 'home')}<div class="wrap" style="padding:40px 16px;text-align:center"><span class="spin" style="display:inline-block"></span><p class="muted" style="margin-top:12px">جارٍ جلب قائمة التلاميذ من جدول المدرسة…</p></div>`;
    try { c = await fetchClass(i); }
    catch(e){
      app.innerHTML = `${topbar('تعذّر التحميل', '', 'home')}<div class="wrap" style="padding:24px 0"><div class="card"><p>${esc(errText(e))}</p>
        <button class="btn primary" type="button" data-act="retry" data-i="${i}">${I.refresh}إعادة المحاولة</button></div></div>`;
      return;
    }
    if (curView() !== 'cls') return;
  } else {
    fetchClass(i).then(() => { if (location.hash === '#cls-' + i) renderClass(i, true); }).catch(() => {});
  }
  renderClass(i);
  scheduleSync(entry.k, 200);
}

function viewGrade(i, sid){
  const ctx = ctxOf(i);
  if (!ctx) return go('cls-' + i);
  const sub = ctx.subjects.find(s => s.id === sid); if (!sub) return go('cls-' + i);
  const items = itemsOf(sub), d = Math.min(ui.tab[i + sid] || 0, items.length - 1);
  document.title = sub.name;
  app.innerHTML = `
  <div class="topbar solid">
    <div class="bar">
      <button class="icon-btn" type="button" data-back="cls-${i}" aria-label="رجوع">${I.back}</button>
      <div class="t"><h1>${esc(sub.name)}</h1><p>${esc(ctx.cls.label)}</p></div>
      <span class="sync" id="syncFlag" data-k="${ctx.k}"></span>
    </div>
    ${items.length > 1 ? `<div class="tabs" role="tablist" aria-label="الميادين" style="--n:${items.length}" id="tabs">${tabsHTML(ctx, sub, d)}</div>` : ''}
  </div>
  <div class="dom-now" style="margin-top:12px"><span id="domNow">${items.length > 1 ? `${items[d].exam ? '' : 'الميدان: '}<b>${esc(items[d].n)}</b>` : `<b>${esc(sub.name)}</b>: علامة واحدة لكل تلميذ`}</span></div>
  <div class="list" id="list">${ctx.students.map((s, k) => cardHTML(ctx, k, s, items[d].f)).join('')}</div>
  <div class="bottombar"><div class="in"><div class="sum" id="sum">${sumHTML(ctx, sub, d)}</div>
    <button class="btn ok" type="button" data-act="confirm">${I.check}تأكيد الحفظ</button></div></div>`;
  app.dataset.i = i; app.dataset.sub = sid;
  setSync(ctx.k, syncState[ctx.k] || (hasPend(ctx.k) ? 'pending' : 'ok'));
}
function tabsHTML(ctx, sub, cur){
  const st = stats(ctx, sub);
  return itemsOf(sub).map((it, d) => `<button class="tab ${it.exam ? 'exam' : ''} ${st.per[d] === st.n ? 'full' : ''}" type="button" role="tab" aria-selected="${d === cur}" data-act="tab" data-d="${d}"><span>${esc(it.n)}</span><span class="cnt">${st.per[d]}/${st.n}</span></button>`).join('');
}
function sumHTML(ctx, sub, d){
  const st = stats(ctx, sub);
  return `<b class="lat">${st.per[d]} / ${st.n}</b> في هذه الخانة<br>المجموع: <span class="lat">${st.filled} / ${st.needed}</span> علامة`;
}
function cardHTML(ctx, k, s, f){
  const v = ctx.get(s.id, f), on = v == null ? null : Math.floor(v), step = getStep();
  const keys = Array.from({ length: 10 }, (_, x) => x + 1).map(x => `<button class="key ${on === x ? 'on' : ''}" type="button" data-act="set" data-v="${x}" aria-pressed="${on === x}">${x}</button>`).join('');
  return `<article class="st ${v == null ? '' : 'done'}" data-s="${esc(s.id)}" data-k="${k}" aria-label="${esc(s.n)}">
    <div class="st-head"><span class="num">${k + 1}</span><h3 class="name">${esc(s.n)}${ctx.lang && s.l ? `<small dir="ltr" style="display:block;font:600 12.5px var(--ui);color:var(--muted);text-align:right">${esc(s.l)}</small>` : ''}</h3>
      <output class="badge ${v == null ? 'empty' : ''}" aria-label="العلامة">${v == null ? '—' : fmt(v)}</output>
      <button class="icon-btn del" type="button" data-act="del" aria-label="حذف العلامة" ${v == null ? 'disabled' : ''}>${I.trash}</button></div>
    <div class="st-body"><div class="keys" role="group" aria-label="العلامة من 1 إلى 10">${keys}</div>
      <div class="step"><button type="button" data-act="plus" aria-label="زيادة ${step}" ${v == null || v >= 10 ? 'disabled' : ''}>+</button>
        <button type="button" data-act="minus" aria-label="نقصان ${step}" ${v == null || v <= 0 ? 'disabled' : ''}>−</button></div></div>
  </article>`;
}
function refreshCard(ctx, sub, d, sid){
  const el = app.querySelector(`.st[data-s="${CSS.escape(sid)}"]`); if (!el) return;
  const k = +el.dataset.k, s = ctx.students[k];
  const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(ctx, k, s, itemsOf(sub)[d].f);
  el.replaceWith(tmp.firstElementChild);
  const tabs = $('#tabs'); if (tabs) tabs.innerHTML = tabsHTML(ctx, sub, d);
  $('#sum').innerHTML = sumHTML(ctx, sub, d);
}
async function confirmSave(i, sid){
  const ctx = ctxOf(i), sub = ctx.subjects.find(s => s.id === sid), st = stats(ctx, sub), items = itemsOf(sub);
  const box = sheet(`<h2>تأكيد حفظ ${esc(sub.name)}</h2>
    <ul class="dl">${items.map((it, d) => `<li class="${st.per[d] === st.n ? 'ok' : 'warn'}"><span>${esc(it.n)}</span><b class="lat">${st.per[d] === st.n ? I.ok : ''}${st.per[d]}/${st.n}</b></li>`).join('')}</ul>
    ${st.filled < st.needed ? `<p class="note">${I.info}<span>بقيت ${st.needed - st.filled} خانة بدون علامة. يمكنك التأكيد الآن وإكمالها لاحقاً.</span></p>` : ''}
    <div class="acts"><button class="btn ok big" type="button" id="cfYes">${I.cloud}تأكيد وإرسال إلى المدرسة</button>
      <button class="btn" type="button" data-close="1">متابعة صب النقاط</button></div>`);
  box.querySelector('#cfYes').onclick = async () => {
    closeSheet(); busy(true, 'جارٍ الإرسال إلى جدول المدرسة…');
    try {
      while (syncing[ctx.k]) await new Promise(r => setTimeout(r, 200));
      const done = await syncNow(ctx.k);
      if (done === false) throw new Error('offline');
      const r = await api(classes[i].api, { action: 'confirm', k: ctx.k, term: ctx.term, subject: sid, t: me });
      if (!r || !r.ok) throw r;
      const c = cacheOf(ctx.k); c.confirms = c.confirms || {}; c.confirms[sid] = { at: r.at, by: me.name }; if (c.edited) delete c.edited[sid]; setCache(ctx.k, c);
      busy(false); buzz(); toast('تم حفظ ' + sub.name + ' وإرساله إلى المدرسة');
      go('cls-' + i);
    } catch(e){
      busy(false);
      toast(e && e.message === 'offline' ? 'لا يوجد اتصال. علاماتك محفوظة في الهاتف، أعد التأكيد عند توفر الإنترنت' : errText(e));
    }
  };
}

    <div class="row"><span class="tile t-violet">${I.mail}</span><div class="grow"><h3>إرسال الجدول النهائي عبر البريد</h3>

    ${last ? `<p class="sent">${I.mailok}<span>آخر إرسال: <bdi dir="ltr">${esc(dmyhm(last.at))}</bdi> · ${esc(last.by)}</span></p>` : ''}
    <button class="btn primary big" type="button" ${attrs}>${I.send}${last ? 'إعادة الإرسال إلى البريد' : 'إرسال PDF و Excel إلى البريد'}</button>

function noteCounts(cn){
  if (!cn) return;

  try { if (navigator.setAppBadge) total ? navigator.setAppBadge(total) : navigator.clearAppBadge(); } catch(e){}
  const prev = store.get('tq:seen');
  if (prev){
    const msgs = [];
    if (cn.summons > prev.s) msgs.push(`${cn.summons - prev.s} طلب استدعاء جديد`);
    if (prev.c != null && (cn.certs || 0) > prev.c) msgs.push(`${cn.certs - prev.c} طلب شهادة مدرسية جديد`);
    if (cn.lastAtt && cn.lastAtt > (prev.a || '')) msgs.push('إرسال جديد لنسبة الحضور الشهرية');
    const newList = prev.l != null && cn.lastList && cn.lastList > prev.l;

    if (msgs.length){ toast('🔔 ' + msgs.join(' · ')); sysNotify('منصة التقويم المستمر', msgs.join(' · '), newList && msgs.length === 1 ? '#lists' : cn.summons > prev.s ? '#inbox-sum' : (prev.c != null && (cn.certs || 0) > prev.c) ? '#inbox-crt' : '#inbox-att'); }
  }

}

const xFill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
const xLine = { style: 'thin', color: { argb: 'FF000000' } }, xBorder = { top: xLine, bottom: xLine, left: xLine, right: xLine };

  hr.height = 34;

// يسأل الخادم عن القوائم المطلوبة من أقسام هذا الأستاذ، وينبّه إلى كل قائمة جديدة
async function pollLists(force, quiet){
  if (!me || listsBusy || (!force && Date.now() - listsAt < 60000)) return;
  const ents = classEntries(); if (!ents.length) return;
  listsBusy = true; listsAt = Date.now();
  const fresh = []; let changed = false;
  try {
    for (const { c, i } of ents){
      try {
        const r = await api(c.api, { action: 'myLists', k: c.k, t: me }, 15000);
        if (!r || !r.ok) continue;
        const old = store.get(listKey(c.k));
        if (old){ const seen = new Set(old.lists.map(l => l.id)); r.lists.forEach(l => { if (!seen.has(l.id) && l.status !== LIST_CLOSED && !l.sent) fresh.push({ l, i }); }); }
        if (!old || JSON.stringify(old.lists) !== JSON.stringify(r.lists)) changed = true;
        store.set(listKey(c.k), { at: Date.now(), lists: r.lists });
      } catch(e){}
    }
  } finally { listsBusy = false; }
  fresh.forEach(({ l, i }) => sysNotify(l.title, 'قائمة مطلوبة من الناظر · ' + entryLabel(i), `#list-${i}-${l.id}`, 'taqwim-list-' + l.id));
  if (fresh.length){ const { l, i } = fresh[0]; buzz(); toast('📋 ' + l.title, { label: 'فتح', fn: () => go(`list-${i}-${l.id}`) }); }

  else refreshNavBadge();
}

  if (act === 'listNew'){ listNewSheet(); return true; }

  if (act === 'lShare' && l){ shareListSheet(l, false); return true; }

  if (act === 'lPrint' && l){ const pg = listPages(l); return printPages(pg, pg[0].includes('page land')), true; }

  if (act === 'lToggle' && l){ const ad = adminOf(), op = l.status === LIST_CLOSED ? 'reopen' : 'close'; busy(true, 'جارٍ الحفظ…');
    try { const r = await api(ad.api, { action: 'listAct', key: ad.key, id: l.id, op }); if (!r || !r.ok) throw r; l.status = r.status; busy(false); toast(op === 'close' ? 'أُغلقت القائمة' : 'أُعيد فتح القائمة'); renderAList(l); } catch(e){ busy(false); toast(errText(e)); } return true; }
  return false;
}

const initials = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0)).join(' ');
const hhmm = s => String(s || '').slice(11, 16);
const dayLabel = d => { const t = todayISO(); if (d === t) return 'اليوم'; const y = new Date(Date.parse(t + 'T12:00:00Z') - 864e5).toISOString().slice(0, 10); return d === y ? 'أمس' : dmy(d); };
const pupils = n => n === 1 ? 'تلميذ واحد' : n === 2 ? 'تلميذان' : n >= 3 && n <= 10 ? `${n} تلاميذ` : `${n} تلميذاً`;
const clsS = l => { const s = String(l || ''), m = /^(.*?) ابتدائي - الفوج (.+)$/.exec(s); if (m) return `${m[1]} (${m[2]})`; const p = /^التربية التحضيرية - الفوج (.+)$/.exec(s); return p ? `التحضيري (${p[1]})` : s; };
const fmtVal = v => { const s = String(v == null ? '' : v); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? dmy(s) : s; };
const isLat = v => /^[\d\s\/\-.:+()A-Za-z@_]+$/.test(String(v || ''));

function teacherEvents(m){
  m = m || store.get('tq:mine'); if (!m) return [];
  const ev = [];
  (m.certs || []).forEach(c => { if (c.status === CRT_READY && c.ready) ev.push({ at: c.ready, id: 'c' + c.id, title: 'جاهزة للاستلام', sub: 'شهادة مدرسية: ' + c.pupil, c: 'k-em', ic: I.ccheck }); });
  (m.summons || []).forEach(s => {
    if (s.status === 'مقبول' && s.decided) ev.push({ at: s.decided, id: 'a' + s.id, title: 'وافق الناظر على الاستدعاء', sub: `ولي التلميذ(ة): ${s.pupil} · ${dayOf(s.date)} ${dmy(s.date)} على ${s.time}`, c: 'k-blue', ic: I.mail });
    if (s.status === 'مقبول' && s.printed) ev.push({ at: s.printed, id: 'p' + s.id, title: 'الاستدعاء جاهز للاستلام', sub: 'ولي التلميذ(ة): ' + s.pupil, c: 'k-em', ic: I.ccheck });
    if (s.status === 'مرفوض' && s.decided) ev.push({ at: s.decided, id: 'r' + s.id, title: 'رفض الناظر طلب الاستدعاء', sub: s.pupil + (s.note ? ' · ' + s.note : ''), c: 'k-rose', ic: I.no });
  });
  return ev.sort((a, b) => b.at.localeCompare(a.at));
}
const ntfSeen = () => store.get('tq:ntfSeen') || '';
const pendLists = () => myLists().filter(x => !x.l.sent && x.l.status !== LIST_CLOSED);
function unreadCount(){ const seen = ntfSeen(); return pendLists().length + teacherEvents().filter(e => e.at > seen).length; }
let mineAt = 0, mineBusy = null;
async function pollMine(force){
  if (!me || !classes.length) return null;
  if (mineBusy) return mineBusy;
  if (!force && Date.now() - mineAt < 60000) return null;
  mineAt = Date.now();
  mineBusy = (async () => {
    try {
      const e = classes[0], r = await api(e.api, { action: 'mine', k: e.k, t: me }, 15000);
      if (!r || !r.ok){ if (r && r.error === 'blocked') toast(errText(r)); return null; }
      const old = store.get('tq:mine'), m = { at: Date.now(), summons: r.summons || [], certs: r.certs || [], lists: r.lists || [] };
      store.set('tq:mine', m);
      const evs = teacherEvents(m);
      if (!old){ if (store.get('tq:ntfSeen') == null) store.set('tq:ntfSeen', evs.length ? evs[0].at : ''); }
      else {
        const was = new Set(teacherEvents(old).map(x => x.id)), fresh = evs.filter(x => !was.has(x.id));
        fresh.slice(0, 3).forEach(x => sysNotify(x.title, x.sub, '#ntf', 'taqwim-' + x.id));
        if (fresh.length){ buzz(); toast('🔔 ' + fresh[0].title + ' · ' + fresh[0].sub, { label: 'عرض', fn: () => go('ntf') }); }
      }
      refreshNavBadge();
      return r;
    } catch(err){ return null; } finally { mineBusy = null; }
  })();
  return mineBusy;
}

function evalSummary(){
  const ents = classes.map((c, i) => ({ c, i, cc: cacheOf(c.k) })).filter(o => !o.c.pe);
  let f = 0, n = 0; const labs = [];
  ents.forEach(o => { if (!o.cc) return; const ctx = ctxOf(o.i); if (!ctx || !ctx.subjects.length) return; ctx.subjects.forEach(s => { const st = stats(ctx, s); f += st.filled; n += st.needed; }); labs.push(clsShort(ctx.cls)); });
  const cc0 = (ents.find(o => o.cc) || {}).cc;
  if (!n){
    const only = classes.length === 1 && cacheOf(classes[0].k);
    return { pct: null, sub: classes.length === 1 ? (only ? clsShort(only.cls) + ' · صب النقاط والجداول' : 'اضغط لفتح قسمك') : `${classes.length} أقسام · اختر القسم` };
  }
  return { pct: Math.round(f / n * 100), sub: (labs.length === 1 ? labs[0] : `${labs.length} أقسام`) + (cc0 ? ' · الفصل ' + TERMS[cc0.term - 1] : '') };
}
function attSummary(){
  const m = todayISO().slice(0, 7), mn = MONTHS[m.slice(5)], got = classes.filter(c => { const cc = cacheOf(c.k); return cc && cc.att && cc.att[m]; }).length;
  if (classes.length === 1) return `${mn}: ${got ? 'أُرسلت ✓' : 'لم تُرسل بعد'}`;
  return `${mn}: ${got} من ${classes.length} أقسام`;
}

let prefetching = false;
async function prefetchClasses(){
  if (prefetching) return;
  const todo = classes.map((c, i) => i).filter(i => !cacheOf(classes[i].k));
  if (!todo.length) return;
  prefetching = true;
  try { for (const i of todo){ try { await fetchClass(i); } catch(e){} } } finally { prefetching = false; }
  if (curView() === 'home' && !$('#overlay').innerHTML){ const y = window.scrollY; viewHome(); window.scrollTo(0, y); }
}
function tgo(t){

function cellText(v){
  if (v == null) return '';
  if (v instanceof Date) return isNaN(v) ? '' : v.toISOString().slice(0, 10);
  if (typeof v === 'object'){
    if (v.richText) return v.richText.map(x => x.text).join('').trim();
    if ('result' in v) return cellText(v.result);
    if (v.text != null) return cellText(v.text);
    if (v.error) return '';
    return '';
  }
  return String(v).trim();
}
async function dbImport(file){
  const a = adminOf();
  busy(true, 'جارٍ قراءة الملف…');
  try {
    await loadScript('exceljs.min.js');
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const ws = wb.worksheets.find(w => w.actualRowCount > 1) || wb.worksheets[0];
    const rows = [];
    ws.eachRow({ includeEmpty: false }, row => { const n = ws.columnCount, r = []; for (let c = 1; c <= n; c++) r.push(cellText(row.getCell(c).value)); rows.push(r); });
    let h = rows.findIndex(r => r.includes('رقم التسجيل') || (r.includes('اللقب') && r.includes('الاسم')));
    if (h < 0) h = 0;
    const headers = rows[h].map(x => x.replace(/\s+/g, ' ').trim());
    const keep = headers.map((x, k) => x ? k : -1).filter(k => k >= 0);
    const data = rows.slice(h + 1).map(r => keep.map(k => r[k] || '')).filter(r => r.some(Boolean));
    if (!data.length) throw new Error('bad_file');
    busy(true, `جارٍ إرسال ${data.length} تلميذاً إلى جدول المدرسة…`);
    const r = await api(a.api, { action: 'dbImport', key: a.key, headers: keep.map(k => headers[k]), rows: data }, 90000); if (!r || !r.ok) throw r;
    busy(false); buzz();
    dbInfoData = { headers: r.headers, count: r.total, matched: r.matched, at: r.at };
    if (listsData) listsData.dbHeaders = r.headers;
    sheet(`<h2>تم استيراد قاعدة البيانات</h2>
      <ul class="dl"><li class="ok"><span>التلاميذ في الملف</span><b>${r.total}</b></li><li class="${r.matched === r.total ? 'ok' : 'warn'}"><span>رُبطوا بتلاميذ المنصة</span><b>${r.matched}</b></li></ul>
      ${r.missing && r.missing.length ? `<p class="muted" style="font-size:12.5px">لم يُربط: ${r.missing.map(esc).join('، ')}</p>` : ''}
      <p style="font-size:13px">صارت أعمدة الملف متاحة عند إنشاء قائمة جديدة، وتُملأ وحدها بعد أن يرسل الأساتذة الأسماء.</p>
      <div class="acts"><button class="btn primary" type="button" data-close="1">حسناً</button></div>`);
    if (curView() === 'aset') renderASet();
  } catch(e){ busy(false); console.error(e); toast(e && e.message === 'bad_file' ? 'لم نجد أسماء تلاميذ في الملف' : errText(e)); }
}

/* ---------- القوائم v5: أقسام وأعمدة يختارها الناظر ---------- */
const listTargets = l => { const t = l.target || []; return t.length ? listsData.classes.filter(c => t.includes(c.id)) : listsData.classes; };
const listCols = l => (l.cols && l.cols.length) ? l.cols : [{ n: 'رقم التسجيل', src: 'رقم التسجيل' }, { n: 'ملاحظة', src: '' }];
function listNewSheet(){
  const d = listsData, H = d.dbHeaders || ['رقم التسجيل'];
  let cols = [{ n: 'رقم التسجيل', src: 'رقم التسجيل' }, { n: 'ملاحظة', src: '' }];
  const tgt = new Set();
  const box = sheet(`<h2>قائمة جديدة</h2>
    <label class="fld" for="lnT">موضوع الجدول<input type="text" id="lnT" maxlength="140" placeholder="مثال: التلاميذ المعفيون من التربية البدنية"></label>
    <div class="qchips">${LIST_SUG.map(t => `<button class="qchip" type="button" data-sug="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <div class="fld">الأقسام التي يصلها الإشعار
      <div class="tchips" id="lnC"><button type="button" class="tchip" data-all="1" aria-pressed="true">${I.check}كل الأقسام</button>${d.classes.map(c => `<button type="button" class="tchip" data-c="${esc(c.id)}" aria-pressed="false">${I.check}${esc(clsShort(c))}</button>`).join('')}</div></div>
    <div class="fld">أعمدة الجدول <small>تأتي بعد الرقم والقسم واسم التلميذ. الأعمدة ذات أيقونة قاعدة البيانات تُملأ وحدها بعد إرسال الأساتذة الأسماء، ولا تظهر لهم.</small>
      <div class="tchips" id="lnK"></div>
      <span class="lbl" style="margin-top:4px">من قاعدة بيانات التلاميذ:</span>
      <div class="tchips" id="lnD">${H.map(h => `<button type="button" class="tchip db" data-h="${esc(h)}" aria-pressed="false">${I.dbl}${esc(h)}</button>`).join('')}</div>
      <span class="lbl" style="margin-top:4px">عمود فارغ باسم تختاره:</span>
      <div style="display:flex;gap:8px"><input type="text" id="lnX" maxlength="40" placeholder="مثال: الإمضاء، الملاحظة"><button class="btn small" type="button" id="lnXa">${I.plus}إضافة</button></div></div>
    <label class="fld" for="lnN">ملاحظة للأساتذة (اختيارية)<textarea id="lnN" rows="2" maxlength="600"></textarea></label>
    <div class="acts"><button class="btn primary" type="button" id="lnGo">${I.send}إنشاء وإرسال</button><button class="btn" type="button" data-close="1">إلغاء</button></div>`);
  const drawCols = () => {
    box.querySelector('#lnK').innerHTML = cols.length ? cols.map((c, k) => `<span class="tchip sel ${c.src ? 'db' : 'cu'}">${c.src ? I.dbl : I.pen}${esc(c.n)}<button type="button" class="rm" data-rm="${k}" aria-label="حذف العمود">×</button></span>`).join('') : '<span class="muted" style="font-size:12.5px">بدون أعمدة إضافية</span>';
    box.querySelectorAll('#lnD .tchip').forEach(b => b.setAttribute('aria-pressed', String(cols.some(c => c.src === b.dataset.h))));
    box.querySelectorAll('#lnK [data-rm]').forEach(b => { b.onclick = () => { cols.splice(+b.dataset.rm, 1); drawCols(); }; });
  };
  drawCols();
  box.querySelectorAll('#lnD .tchip').forEach(b => { b.onclick = () => { const h = b.dataset.h, k = cols.findIndex(c => c.src === h); if (k >= 0) cols.splice(k, 1); else if (cols.length < 8) cols.push({ n: h, src: h }); else toast('ثمانية أعمدة على الأكثر'); drawCols(); }; });
  const addX = () => { const inp = box.querySelector('#lnX'), n = inp.value.trim().replace(/\s+/g, ' '); if (!n) return; if (cols.length >= 8) return toast('ثمانية أعمدة على الأكثر'); cols.push({ n, src: '' }); inp.value = ''; drawCols(); };
  box.querySelector('#lnXa').onclick = addX;
  box.querySelector('#lnX').addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); addX(); } });
  const drawTgt = () => { box.querySelector('#lnC [data-all]').setAttribute('aria-pressed', String(!tgt.size)); box.querySelectorAll('#lnC [data-c]').forEach(b => b.setAttribute('aria-pressed', String(tgt.has(b.dataset.c)))); };
  box.querySelectorAll('#lnC .tchip').forEach(b => { b.onclick = () => { if (b.dataset.all) tgt.clear(); else if (tgt.has(b.dataset.c)) tgt.delete(b.dataset.c); else tgt.add(b.dataset.c); drawTgt(); }; });
  box.querySelectorAll('[data-sug]').forEach(b => { b.onclick = () => { box.querySelector('#lnT').value = b.dataset.sug; box.querySelectorAll('[data-sug]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }; });
  box.querySelector('#lnGo').onclick = async () => {
    const title = box.querySelector('#lnT').value.trim().replace(/\s+/g, ' '), note = box.querySelector('#lnN').value.trim(), a = adminOf();
    if (title.length < 3){ toast('اكتب موضوع الجدول'); box.querySelector('#lnT').focus(); return; }
    const classesSel = d.classes.filter(c => tgt.has(c.id)).map(c => c.id);
    closeSheet(); busy(true, 'جارٍ إنشاء القائمة…');
    try {
      const r = await api(a.api, { action: 'listNew', key: a.key, title, note, classes: classesSel, cols }); if (!r || !r.ok) throw r;
      const l = { id: r.id, at: r.at, title, note, status: 'مفتوحة', target: r.target || classesSel, cols: r.cols || cols, replies: [] };
      listsData.lists.unshift(l); busy(false); buzz();
      if (curView() === 'lists') renderLists();
      shareListSheet(l, true);
    } catch(e){ busy(false); toast(errText(e)); }
  };
}

async function handleV5(act, a){
  if (act === 'tgo'){ tgo(a.dataset.t); return true; }
  if (act === 'themeRe'){ toggleTheme(); route(true); return true; }
  if (act === 'cpick'){ certPick(a); return true; }
  if (act === 'csend'){ certSend(+a.dataset.i); return true; }
  if (act === 'mtab'){ mineTab = a.dataset.t; history.replaceState(null, '', '#mine-' + mineTab); const m = store.get('tq:mine'); if (m) renderMine(m); return true; }
  if (act === 'ntfRe'){ busy(true, 'جارٍ التحديث…'); await Promise.all([pollLists(true, true), pollMine(true)]); busy(false); renderNtf(true); return true; }
  if (act === 'tlRe'){ busy(true, 'جارٍ التحديث…'); await pollLists(true, true); busy(false); viewTLists(); return true; }
  if (act === 'mineXlsx'){ const m = store.get('tq:mine'); if (!m) return true; busy(true, 'جارٍ إعداد ملف Excel…');
    try { const rows = teacherLog(m).map(e => [dayOf(e.at.slice(0, 10)), dmy(e.at.slice(0, 10)), hhmm(e.at), e.kind, e.who, '', e.cls, me.name, e.st]);
      const b = await buildLogXLSX('سجل طلبات ' + me.name, rows); busy(false); await saveBlob(b, `سجل_الطلبات_${safeName(me.name)}.xlsx`); } catch(e){ busy(false); console.error(e); toast('تعذّر إعداد الملف'); } return true; }
  if (act === 'cfil'){ crtFilter = a.dataset.f; renderInbox('crt'); return true; }
  if (act === 'crtOk'){ certAct(a.dataset.id, 'ready'); return true; }
  if (act === 'crtUndo'){ certAct(a.dataset.id, 'undo'); return true; }
  if (act === 'logXlsx'){ busy(true, 'جارٍ إعداد ملف Excel…');
    try { const rows = adminLog().map(e => [dayOf(e.at.slice(0, 10)), dmy(e.at.slice(0, 10)), hhmm(e.at), e.kind, e.pupil, e.reg, e.cls, e.teacher, e.st]);
      const b = await buildLogXLSX('سجل الطلبات: الشهادات المدرسية واستدعاءات الأولياء', rows); busy(false); await saveBlob(b, `سجل_الطلبات_${inboxData.year.replace('/', '-')}.xlsx`); } catch(e){ busy(false); console.error(e); toast('تعذّر إعداد الملف'); } return true; }
  if (act === 'aclsRe'){ viewAcls(dashData && dashData.term); return true; }
  if (act === 'tchRe'){ viewTeachers(); return true; }
  if (act === 'tEdit'){ teacherSheet(a.dataset.p); return true; }
  if (act === 'asetRe'){ viewASet(); return true; }
  if (act === 'prToggle'){ const p = printerOf() || {}; p.on = !p.on; const n = $('#prN'); if (n && n.value.trim()) p.name = n.value.trim(); store.set('tq:printer', p); toast(p.on ? 'يظهر زر «طباعة» في الجداول والغيابات والقوائم' : 'أُخفي زر «طباعة»'); renderASet(); return true; }
  if (act === 'prSave'){ const p = printerOf() || {}, n = $('#prN').value.trim(); p.name = n; if (n) p.on = true; store.set('tq:printer', p); toast(n ? 'حُفظت الطابعة: ' + n : 'حُذف اسم الطابعة'); renderASet(); return true; }
  if (act === 'prTest'){ const n = $('#prN') && $('#prN').value.trim(); if (n){ const p = printerOf() || {}; p.name = n; store.set('tq:printer', p); } printPages([testPage()], false); return true; }
  if (act === 'attPrint'){ printPages([attPage(attMonth)], true); return true; }
  if (act === 'aprint'){ const c0 = adminCtxCache[a.dataset.id], w = a.dataset.w || 'main'; if (!c0) return true; const ctx = { ...c0, teacher: c0.teacherOf ? c0.teacherOf(w) : c0.teacher }; printPages(pagesOf(ctx, w), w === 'main'); return true; }
  return false;
}

/* =========================================================
   الأحداث
   ========================================================= */
app.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const b = e.target.closest('[data-back]'); if (b){ back(b.dataset.back); return; }
  const st = e.target.closest('[data-step]'); if (st){ store.set('tq:step', +st.dataset.step); route(true); return; }
  const tm = e.target.closest('[data-term]'); if (tm){ viewAcls(+tm.dataset.term); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'scan') return scanQR();
  if (act === 'theme') return toggleTheme();
  if (act === 'nav') return navTo(a.dataset.t);
  if (act === 'mail'){ const c = ctxOf(+a.dataset.i); if (c) mailSheet(c, c.lang || 'main'); return; }
  if (act === 'amail'){ const c0 = adminCtxCache[a.dataset.id], w = a.dataset.w || 'main', ad = adminOf(); if (c0 && ad) mailSheet({ ...c0, teacher: c0.teacherOf ? c0.teacherOf(w) : c0.teacher }, w, { id: a.dataset.id, api: ad.api, key: ad.key }); return; }
  if (act === 'install') return doInstall();
  if (act === 'noinstall'){ store.set('tq:noInstall', true); return viewHome(); }
  if (act === 'retry') return viewClass(+a.dataset.i);
  if (act === 'refresh'){ busy(true, 'جارٍ التحديث…'); try { await syncNow(classes[+a.dataset.i].k); await fetchClass(+a.dataset.i); busy(false); renderClass(+a.dataset.i); toast('تم التحديث'); } catch(err){ busy(false); toast(errText(err)); } return; }
  if (act === 'pdf' || act === 'xlsx') return exportCtx(ctxOf(+a.dataset.i), act);
  if (act === 'share-pdf' || act === 'share-xlsx') return exportCtx(ctxOf(+a.dataset.i), act.slice(6), true);
  if (act === 'apdf' || act === 'axlsx'){ const c0 = adminCtxCache[a.dataset.id], w = a.dataset.w || 'main'; return exportCtx({ ...c0, teacher: c0.teacherOf ? c0.teacherOf(w) : c0.teacher }, act.slice(1), false, w); }
  if (act === 'qrSubj'){ const x = dashData.subj[+a.dataset.j]; return showQR(subjLabel(x), 'يفتح أقسامه فقط: ' + clsListShort(x.classes), subjLink(adminOf(), x)); }
  if (act === 'notifOn'){ try { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'ستصلك الإشعارات ما دامت اللوحة مفتوحة' : 'لم يُسمح بالإشعارات'); } catch(err){} return route(true); }
  if (await handleV5(act, a)) return;
  if (await handleV4(act, a)) return;
  if (await handleV2(act, a)) return;
  if (act === 'dashRefresh') return viewDash();
  if (act === 'setTerm'){ const ad = adminOf(), t = +a.dataset.t; if (dashData && dashData.curTerm === t && curView() === 'aset') return; busy(true); try { const r = await api(ad.api, { action: 'setTerm', key: ad.key, term: t }); if (!r.ok) throw r; busy(false); toast('الفصل الحالي للأساتذة: ' + TERMS[t - 1]); if (dashData) dashData.curTerm = t; if (curView() === 'acls') viewAcls(t); else route(true); } catch(err){ busy(false); toast(errText(err)); } return; }
  if (act === 'qrAll') return qrCardsPDF();
  if (act === 'qrOne'){ const c = dashData.classes.find(x => x.id === a.dataset.id); return showQR(c.label, 'يمسحه الأستاذ بكاميرا هاتفه فيفتح قسمه مباشرة', teacherLink(adminOf(), c)); }
  if (act === 'qrAdmin'){ const ad = adminOf(); return showQR('فتح لوحة الناظر على الهاتف', 'امسح هذا الرمز بهاتفك. لا تشاركه مع أحد', `${appBase()}#admin=${encodeURIComponent(ad.key)}&${linkParamsFor(ad.api)}`); }
  if (act === 'adminOut'){ store.del('tq:admin'); dashData = null; location.replace(me ? '#home' : '#reg'); return; }
  if (!['confirm', 'tab', 'set', 'plus', 'minus', 'del'].includes(act) || !classes[+app.dataset.i]) return;

  // صب النقاط
  const i = +app.dataset.i, sid = app.dataset.sub;
  if (act === 'confirm') return confirmSave(i, sid);
  let ctx = ctxOf(i); if (!ctx) return;
  const sub = ctx.subjects.find(s => s.id === sid), items = itemsOf(sub);
  if (act === 'tab'){
    const d = +a.dataset.d; ui.tab[i + sid] = d;
    $('#tabs').innerHTML = tabsHTML(ctx, sub, d);
    $('#domNow').innerHTML = `${items[d].exam ? '' : 'الميدان: '}<b>${esc(items[d].n)}</b>`;
    $('#list').innerHTML = ctx.students.map((s, k) => cardHTML(ctx, k, s, items[d].f)).join('');
    $('#sum').innerHTML = sumHTML(ctx, sub, d);
    window.scrollTo({ top: 0, behavior: 'auto' });
    return;
  }
  const card = a.closest('.st'); if (!card) return;
  const s = card.dataset.s, d = Math.min(ui.tab[i + sid] || 0, items.length - 1), f = items[d].f, v = ctx.get(s, f), step = getStep();
  if (act === 'set'){ ctx = setMark(ctx, s, f, +a.dataset.v); buzz(); }
  else if (act === 'plus' && v != null) ctx = setMark(ctx, s, f, v + step);
  else if (act === 'minus' && v != null) ctx = setMark(ctx, s, f, v - step);
  else if (act === 'del' && v != null){
    ctx = setMark(ctx, s, f, null);
    const nm = ctx.students.find(x => x.id === s).n;
    toast(`حُذفت علامة ${nm}`, { label: 'تراجع', fn: () => { const c2 = setMark(ctxOf(i), s, f, v); if (location.hash === `#grade-${i}-${sid}`) refreshCard(c2, sub, d, s); } });
  }
  refreshCard(ctx, sub, d, s);
  const nb = app.querySelector(`.st[data-s="${CSS.escape(s)}"] [data-act="${act}"]`);
  if (nb && !nb.disabled && act !== 'set') nb.focus({ preventScroll: true });
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- start ---------- */
(function boot(){
  const h = location.hash;
  if (h.includes('=')){
    const p = parseParams(h);
    if (p.k){ const i = addClass(p.k, apiFromParams(p)); history.replaceState(null, '', location.pathname + (me ? '#cls-' + i : '#reg')); }
    else if (p.f){ store.set('tq:addf', { f: p.f, api: apiFromParams(p) }); history.replaceState(null, '', location.pathname + '#addf'); }
    else if (p.admin){ store.set('tq:admin', { api: apiFromParams(p), key: p.admin }); history.replaceState(null, '', location.pathname + '#dash'); }
  }
  themeMeta();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { themeMeta(); if (curView() === 'home' || curView() === 'reg') route(true); }); } catch(e){}
  route();
  classes.forEach(c => scheduleSync(c.k, 1500));
  // القوائم المطلوبة: سؤال الخادم كل 3 دقائق وعند الرجوع إلى التطبيق
  setInterval(() => { pollLists(); pollMine(); }, 180000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ pollLists(); pollMine(); } });
  if (!IS_ARTIFACT && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
