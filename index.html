<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التقويم">
<meta name="description" content="منصة التقويم المستمر لمدرسة أحمد فقير">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>التقويم المستمر</title>
<style>
@font-face{font-family:Cairo;font-weight:400;font-display:swap;src:url(cairo-ar-400.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:600;font-display:swap;src:url(cairo-ar-600.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:800;font-display:swap;src:url(cairo-ar-800.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;font-weight:400;font-display:swap;src:url(cairo-la-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:600;font-display:swap;src:url(cairo-la-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Cairo;font-weight:800;font-display:swap;src:url(cairo-la-800.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Amiri;font-weight:700;font-display:swap;src:url(amiri-ar-700.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Amiri;font-weight:700;font-display:swap;src:url(amiri-la-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}

/* Layout idea: a school register on a phone. Greeting and class list first, one card per pupil, sticky domains, fixed confirm bar. */
:root{
  --bg:#eef2f6;--surface:#ffffff;--ink:#13202e;--muted:#5a6878;--line:#d7dee7;
  --accent:#1d4e79;--accent-ink:#163c5e;--accent-soft:#d9e2f3;--on-accent:#ffffff;
  --ok:#1e7a4c;--ok-soft:#dcf1e5;--warn:#b86e00;--warn-soft:#fff1cc;--danger:#b3261e;
  --ui:Cairo,"Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --doc:"Khalid Art bold",Amiri,"Traditional Arabic","Times New Roman",serif;
  --radius:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151d;--surface:#16202b;--ink:#e6edf4;--muted:#9babbc;--line:#27364a;
  --accent:#79acdc;--accent-ink:#bcd6ef;--accent-soft:#1d3148;--on-accent:#0c1824;
  --ok:#5fc48f;--ok-soft:#173326;--warn:#f0b443;--warn-soft:#3a2c0f;--danger:#f08a82;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151d;--surface:#16202b;--ink:#e6edf4;--muted:#9babbc;--line:#27364a;
  --accent:#79acdc;--accent-ink:#bcd6ef;--accent-soft:#1d3148;--on-accent:#0c1824;
  --ok:#5fc48f;--ok-soft:#173326;--warn:#f0b443;--warn-soft:#3a2c0f;--danger:#f08a82;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--ui);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.bar .t{flex:1;min-width:0}
.bar .t h1{font:800 17px/1.35 var(--ui)}
.bar .t p{font:400 12.5px/1.4 var(--ui);color:var(--muted)}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0}
.icon-btn svg{width:20px;height:20px}
.sync{font:700 11.5px var(--ui);display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok)}.sync.busy{color:var(--accent)}.sync.off{color:var(--warn)}

.home-head{background:var(--accent);color:var(--on-accent);padding:calc(18px + env(safe-area-inset-top)) 0 64px}
.home-head .rep{font:400 12.5px var(--ui);opacity:.85}
.home-head .sch{font:800 22px/1.3 var(--ui);margin-top:2px}
.lift{margin-top:-48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:0 8px 24px rgb(19 32 46 / .08)}
.hello{font:800 24px/1.35 var(--ui)}
.hello b{color:var(--accent)}
.lbl{font:600 12px var(--ui);color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px var(--ui);padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 15px var(--ui);text-decoration:none;color:inherit}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:13.5px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.link{background:transparent;border-color:transparent;color:var(--accent);min-height:40px}
.btn.danger-t{color:var(--danger);background:transparent;border-color:transparent}
.sec{margin-top:22px;display:grid;gap:10px}
.sec>h2{font:800 15px var(--ui);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.pill{font:700 12px var(--ui);padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.draft{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.prog{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog.full i{background:var(--ok)}
.meta{font:400 12.5px var(--ui);color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-height:44px;font-size:14px}
.class-item{text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.class-item .ic{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font:800 16px var(--ui);flex:none}
.class-item h3{font:800 16px/1.4 var(--ui)}
.class-item p{font-size:12.5px;color:var(--muted)}
.class-item svg{width:20px;height:20px;flex:none;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font:700 14px var(--ui);min-width:56px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.setting{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setting p{font:600 14px var(--ui)}
.setting small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.install-card{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:12px}
.install-card img{width:44px;height:44px;border-radius:11px;flex:none}
.install-card p{flex:1;font:600 13.5px/1.5 var(--ui)}
.foot{padding:26px 0 40px;text-align:center;display:grid;gap:4px;justify-items:center}
.safe{padding:10px 12px;border-radius:10px;background:var(--ok-soft);font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.safe svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--ok)}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:13.5px}
.form{display:grid;gap:14px}
.fld{display:grid;gap:6px;font:700 13.5px var(--ui)}
.fld small{color:var(--muted);font-weight:400}
.fld .err{color:var(--danger);font:600 12.5px var(--ui)}
input[type=text],input[type=tel],input[type=url],input[type=password]{width:100%;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px}
input.ltr{direction:ltr;text-align:left}
.greet{border-radius:16px;padding:16px;background:var(--accent-soft);color:var(--accent-ink);font:800 22px/1.4 var(--ui);text-align:center}
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding:8px 0}
.empty svg{width:56px;height:56px;color:var(--accent)}

/* subject cards */
.subj{text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.subj .h{display:flex;align-items:center;gap:12px}
.subj .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font:800 19px var(--ui);flex:none}
.subj h3{font:800 17px var(--ui);flex:1}
.subj ol{margin:0;padding:0 18px 0 0;font-size:13px;color:var(--muted)}

/* grading */
.tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;padding:0 10px 10px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 3px 6px;font:700 11.5px/1.3 var(--ui);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;min-height:64px;text-align:center}
.tab.exam{border-style:dashed;border-color:var(--warn)}
.tab .cnt{font:800 11px var(--ui);padding:0 7px;border-radius:99px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.tab.full .cnt{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] .cnt{background:var(--on-accent);color:var(--accent-ink);border-color:transparent}
.dom-now{max-width:720px;margin:0 auto;padding:12px 16px 2px;font:700 13px var(--ui);color:var(--muted)}
.dom-now b{color:var(--ink)}
.list{max-width:720px;margin:0 auto;padding:8px 12px calc(110px + env(safe-area-inset-bottom));display:grid;gap:10px}
.st{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--warn);border-radius:var(--radius);padding:10px 12px 12px;display:grid;gap:10px}
.st.done{border-inline-start-color:var(--ok)}
.st-head{display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;flex:none;border-radius:8px;background:var(--bg);display:grid;place-items:center;font:800 13px var(--ui);color:var(--muted)}
.name{flex:1;min-width:0;font:800 16px/1.4 var(--ui)}
.badge{min-width:58px;height:36px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font:800 18px var(--ui);background:var(--accent-soft);color:var(--accent-ink);flex:none}
.badge.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:600}
.del{color:var(--danger)}
.del:disabled{color:var(--line)}
.st-body{display:flex;gap:8px;align-items:stretch}
.keys{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.key{height:46px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font:800 18px var(--ui);padding:0}
.key:active{transform:scale(.95)}
.key.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step{display:grid;grid-template-rows:1fr 1fr;gap:6px;width:52px;flex:none}
.step button{border-radius:11px;border:1px solid var(--line);background:var(--surface);font:800 22px/1 var(--ui);padding:0}
.step button:disabled{opacity:.4}
@media (min-width:560px){.keys{grid-template-columns:repeat(10,minmax(0,1fr))}.step{grid-template-rows:none;grid-template-columns:1fr 1fr;width:110px}}
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:720px;margin:0 auto;padding:0 12px;display:flex;align-items:center;gap:12px}
.bottombar .sum{flex:1;font:600 12.5px/1.45 var(--ui);color:var(--muted)}
.bottombar .sum b{color:var(--ink);font-size:14px}
.bottombar .btn{min-height:50px}

/* export + preview */
.exp{padding:16px 0 40px;display:grid;gap:14px}
.exp>*,#pv,.pv{min-width:0}
.pv{overflow:hidden;border-radius:6px;box-shadow:0 1px 0 var(--line),0 6px 18px rgb(19 32 46 / .12)}
.pv>.page{transform-origin:top right}
.miss{margin:0;padding:0 18px 0 0;font-size:13px;color:var(--muted)}

/* printable pages */
.page{background:#fff;color:#000;font-family:var(--doc);font-weight:700;direction:rtl;position:relative}
.page.land{width:1123px;height:794px;padding:30px 40px}
.page.port{width:794px;height:1123px;padding:48px 46px}
.page .d-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.page .d-rep{text-align:center;font-size:16px;line-height:1.35;grid-column:2}
.page .d-sch{font-size:13.5px;line-height:1.4;margin-top:2px}
.page .d-title{text-align:center;font-size:18px;line-height:1.4}
.page .d-sub{text-align:center;font-size:13.5px;line-height:1.4;margin:0 0 8px}
.page table{width:100%;border-collapse:collapse;table-layout:fixed}
.page th,.page td{border:1px solid #000;text-align:center;vertical-align:middle;padding:0 3px}
.page th{background:#d9e2f3;font-size:11px;line-height:1.25}
.page th.sb{font-size:13.5px;height:22px}
.page th.lv2{font-size:11.5px;height:20px}
.page th.dm{height:46px}
.page td{font-size:11px;line-height:1.05;padding-top:0;padding-bottom:1px}
.page td.n{text-align:right;padding-right:5px}
.page td.calc{background:#f1f4f9}
.page .d-foot{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.page .d-pg{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;color:#555}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:14px;height:100%}
.qrcard{border:1.5px dashed #888;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.qrcard .s{font-size:12px;color:#333}
.qrcard .c{font-size:17px;line-height:1.3}
.qrcard img{width:150px;height:150px;image-rendering:pixelated}
.qrcard .h{font-size:11.5px;color:#333}
#printRoot{position:absolute;left:-14000px;top:0}

/* admin */
.ac{display:grid;gap:8px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.mini .prog{height:6px}
.qrbig{display:grid;justify-items:center;gap:8px}
.qrbig img{width:230px;height:230px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:10px}
.linkbox{direction:ltr;font:600 11.5px/1.5 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all;color:var(--muted)}

/* overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(8 14 20 / .5);display:grid;align-items:end;justify-items:center;padding:12px}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:20px;padding:20px 18px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{font:800 18px var(--ui)}
.sheet h3{font:800 14.5px var(--ui);margin-top:4px}
.sheet ol{margin:0;padding:0 20px 0 0;display:grid;gap:4px;font-size:14px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.dl{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.dl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13.5px}
.dl li b{font-weight:800}
.dl li.ok b{color:var(--ok)}
.dl li.warn b{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;font:600 14px var(--ui);max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.toast button{background:transparent;border:0;color:var(--accent-soft);font:800 14px var(--ui);padding:4px 2px}
.busy{position:fixed;inset:0;z-index:70;background:rgb(8 14 20 / .45);display:grid;place-items:center}
.busy div{background:var(--surface);padding:18px 22px;border-radius:16px;font:700 15px var(--ui);display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.key:active{transform:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="printRoot" aria-hidden="true"></div>
<div id="overlay"></div>

<script>
'use strict';
/* =========================================================
   منصة التقويم المستمر – مدرسة أحمد فقير
   لا توجد أسماء تلاميذ هنا: تُجلب من جدول المدرسة عند مسح رمز القسم
   ========================================================= */
const REP = 'الجمهورية الجزائرية الديمقراطية الشعبية';
const SCHOOL_DEFAULT = 'مدرسة أحمد فقير';
const TERMS = ['الأول', 'الثاني', 'الثالث'];
function subjectsFor(level){
  return [
    { id: 'ar', name: 'اللغة العربية', icon: 'ع', exam: 'ae',
      domains: [{ f: 'a1', n: 'التعبير والتواصل الشفوي' }, { f: 'a2', n: 'القراءة والمحفوظات' }, { f: 'a3', n: level <= 2 ? 'الكتابة والإملاء' : 'الإنتاج الكتابي' }] },
    { id: 'math', name: 'الرياضيات', icon: '∑', exam: 'me',
      domains: [{ f: 'm1', n: 'الأعداد والحساب' }, { f: 'm2', n: 'المقادير والقياس' }, { f: 'm3', n: 'تنظيم المعطيات' }, { f: 'm4', n: 'الفضاء والهندسة' }] },
    { id: 'mu', name: 'التربية الموسيقية', icon: '♪', single: 'mu' },
    { id: 'pl', name: 'التربية التشكيلية', icon: '✎', single: 'pl' }
  ];
}
const itemsOf = s => s.single ? [{ f: s.single, n: 'العلامة' }] : [...s.domains, { f: s.exam, n: 'الاختبار', exam: true }];

/* ---------- local storage (this phone only) ---------- */
const mem = {};
const store = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};

const setPend = (k, t, p) => store.set(pendKey(k, t), p);

const loaded = {};
function loadScript(src){
  return loaded[src] || (loaded[src] = new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = () => { delete loaded[src]; rej(new Error('تعذّر تحميل ' + src)); };
    document.head.appendChild(el);
  }));
}
function normPhone(p){
  let s = String(p || '').replace(/[\s\-.]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if (s.startsWith('+213')) s = '0' + s.slice(4); else if (s.startsWith('00213')) s = '0' + s.slice(5); else if (s.startsWith('213') && s.length === 12) s = '0' + s.slice(3);
  return s;
}
const validPhone = p => /^0[5-7]\d{8}$/.test(p);
function apiFromParams(p){ return p.u ? p.u : p.s ? `https://script.google.com/macros/s/${p.s}/exec` : null; }
function depOf(url){ const m = /\/macros\/s\/([^/]+)\/exec/.exec(url || ''); return m ? m[1] : null; }
function linkParamsFor(api){ const d = depOf(api); return d ? 's=' + d : 'u=' + encodeURIComponent(api); }
const appBase = () => location.origin + location.pathname;

/* ---------- server calls ---------- */
async function api(url, body){
  if (!url) throw new Error('no_server');
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(url, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
    const j = await r.json();
    return j;
  } finally { clearTimeout(tm); }
}
const errText = e => {
  const m = String(e && (e.error || e.message) || e);
  if (m === 'bad_token') return 'رمز القسم غير صالح. اطلب رمزاً جديداً من المدير';
  if (m === 'bad_key') return 'مفتاح المدير غير صحيح';
  if (/fetch|network|abort|Failed/i.test(m)) return 'لا يوجد اتصال بالإنترنت';
  return 'حدث خطأ: ' + m;
};

/* =========================================================
   المزامنة: كل ضغطة تُحفظ في الهاتف فوراً ثم تُرسل إلى الجدول
   ========================================================= */
const syncState = {};
let syncTimers = {}, syncing = {};
function setSync(k, s){
  syncState[k] = s;
  const el = $('#syncFlag');
  if (el && el.dataset.k === k){
    el.className = 'sync ' + ({ ok: 'ok', busy: 'busy', pending: 'busy', off: 'off' }[s] || '');
    el.textContent = { ok: 'محفوظ في الجدول', busy: 'جارٍ الإرسال…', pending: 'جارٍ الإرسال…', off: 'محفوظ في الهاتف، سيُرسل لاحقاً' }[s] || '';
  }
}
function scheduleSync(k, ms = 1200){ clearTimeout(syncTimers[k]); syncTimers[k] = setTimeout(() => syncNow(k), ms); }
const hasPend = k => [1, 2, 3].some(t => Object.keys(pendOf(k, t).items).length);
async function syncNow(k){
  const c = cacheOf(k), entry = classes.find(x => x.k === k);
  if (!c || !entry) return false;
  if (syncing[k]) return null;
  syncing[k] = true;
  try {
    for (const t of [1, 2, 3]){
      const p = pendOf(k, t), keys = Object.keys(p.items);
      if (!keys.length) continue;
      setSync(k, 'busy');
      const sent = { ...p.items };
      const changes = keys.map(key => { const [s, f] = key.split('|'); return { s, f, v: sent[key] }; });
      const r = await api(entry.api, { action: 'save', k, term: t, t: me, changes });
      if (!r || !r.ok) throw r || new Error('save_failed');
      const cc = cacheOf(k), p2 = pendOf(k, t);
      if (cc && cc.term === t){
        keys.forEach(key => { const [s, f] = key.split('|'); cc.marks[s] = cc.marks[s] || {}; if (sent[key] == null) delete cc.marks[s][f]; else cc.marks[s][f] = sent[key]; });
        setCache(k, cc);
      }
      keys.forEach(key => { if (p2.items[key] === sent[key]) delete p2.items[key]; });
      setPend(k, t, p2);
    }
    const left = [1, 2, 3].some(t => Object.keys(pendOf(k, t).items).length);
    setSync(k, left ? 'pending' : 'ok');
    if (left) scheduleSync(k, 600);
    return !left;
  } catch(e){
    setSync(k, 'off');
    scheduleSync(k, 20000);
    return false;
  } finally { syncing[k] = false; }
}
window.addEventListener('online', () => classes.forEach(c => scheduleSync(c.k, 300)));

/* ---------- class data ---------- */
async function fetchClass(i){
  const entry = classes[i];
  const r = await api(entry.api, { action: 'class', k: entry.k, t: me });
  if (!r || !r.ok) throw r;
  const old = cacheOf(entry.k);
  r.edited = (old && old.term === r.term && old.edited) || {};
  setCache(entry.k, r);
  entry.label = r.cls.label; entry.n = r.students.length; saveClasses();
  return r;
}
function ctxOf(i){
  const entry = classes[i], c = cacheOf(entry.k);
  if (!c) return null;
  const p = pendOf(entry.k, c.term).items;
  return {
    k: entry.k, i, c, term: c.term, year: c.year, school: c.school || SCHOOL_DEFAULT, cls: c.cls, students: c.students,
    subjects: subjectsFor(c.cls.level), teacher: me ? me.name : '',
    get(sid, f){ const key = sid + '|' + f; if (key in p) return p[key]; const m = c.marks[sid]; return m && m[f] != null ? m[f] : null; }
  };
}
function setMark(ctx, sid, f, v){
  const val = v == null ? null : Math.min(10, Math.max(0, round2(v)));
  const p = pendOf(ctx.k, ctx.term); p.items[sid + '|' + f] = val; setPend(ctx.k, ctx.term, p);
  const c = cacheOf(ctx.k), sub = ctx.subjects.find(s => itemsOf(s).some(it => it.f === f));
  if (c && sub && c.confirms && c.confirms[sub.id]){ c.edited = c.edited || {}; c.edited[sub.id] = true; setCache(ctx.k, c); }
  setSync(ctx.k, 'pending'); scheduleSync(ctx.k);
  return ctxOf(ctx.i);
}
function stats(ctx, sub){
  const items = itemsOf(sub), n = ctx.students.length;
  let filled = 0; const per = items.map(it => { const f = ctx.students.reduce((a, s) => a + (ctx.get(s.id, it.f) != null ? 1 : 0), 0); filled += f; return f; });
  return { filled, needed: n * items.length, per, n };
}
function subStatus(ctx, sub){
  const c = ctx.c, cf = c.confirms && c.confirms[sub.id], ed = c.edited && c.edited[sub.id];
  if (cf && !ed) return { cls: 'ok', txt: 'مؤكد' };
  if (cf && ed) return { cls: 'warn', txt: 'عُدّل بعد التأكيد' };
  return { cls: 'draft', txt: stats(ctx, sub).filled ? 'مسودة' : 'لم يبدأ' };
}
function caAvg(ctx, sid, sub){
  const v = sub.domains.map(d => ctx.get(sid, d.f));
  return v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0) / v.length;
}
function subjAvg(ctx, sid, sub){
  const ca = caAvg(ctx, sid, sub), ex = ctx.get(sid, sub.exam);
  return ca == null || ex == null ? null : (ca + ex) / 2;
}

/* =========================================================
   مسح رمز QR من داخل التطبيق
   ========================================================= */
function handleLink(text){
  const h = String(text || '').split('#')[1] || '';
  const p = parseParams(h);
  if (p.k){ const i = addClass(p.k, apiFromParams(p)); toast('تمت إضافة القسم'); go(me ? 'cls-' + i : 'reg'); return true; }
  if (p.admin){ store.set('tq:admin', { api: apiFromParams(p), key: p.admin }); go('dash'); return true; }
  toast('هذا الرمز لا يخص المنصة'); return false;
}
async function scanQR(){
  const canScan = 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && !IS_ARTIFACT;
  if (!canScan){
    sheet(`<h2>مسح رمز القسم</h2><ol><li>افتح كاميرا الهاتف ووجّهها نحو رمز QR الخاص بقسمك.</li><li>اضغط على الرابط الذي يظهر فوق الرمز.</li><li>سيفتح القسم مباشرة في التطبيق.</li></ol>
      <div class="acts"><button class="btn primary" type="button" data-close="1">حسناً</button></div>`);
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch(e){ toast('لم يُسمح باستعمال الكاميرا'); return; }
  const box = sheet(`<h2>وجّه الكاميرا نحو رمز القسم</h2><video id="scanV" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover"></video>
    <div class="acts"><button class="btn" type="button" data-close="1">إلغاء</button></div>`);
  const v = box.querySelector('#scanV'); v.srcObject = stream;
  const stop = () => stream.getTracks().forEach(t => t.stop());
  try { await v.play(); } catch(e){}
  const det = new BarcodeDetector({ formats: ['qr_code'] });
  while (document.body.contains(v)){
    try { const r = await det.detect(v); if (r.length){ stop(); closeSheet(); handleLink(r[0].rawValue); return; } } catch(e){}
    await new Promise(r => setTimeout(r, 250));
  }
  stop();
}

   ========================================================= */
let depth = 0;
const curView = () => location.hash.replace('#', '').split('-')[0] || 'home';
function go(h){ depth++; location.hash = h; }
function back(fallback){ if (depth > 0){ depth--; history.back(); } else { location.replace('#' + fallback); } }
function parseParams(h){ const o = {}; String(h || '').replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; }
function addClass(k, apiUrl){
  let i = classes.findIndex(c => c.k === k);
  if (i < 0){ classes.push({ k, api: apiUrl || (classes[0] && classes[0].api) || store.get('tq:api') }); i = classes.length - 1; }
  else if (apiUrl) classes[i].api = apiUrl;
  if (apiUrl) store.set('tq:api', apiUrl);
  saveClasses();
  return i;
}
function route(keep){
  const h = location.hash.replace('#', '');
  const [v, a, b] = h.split('-');
  closeSheet();
  if (keep !== true) window.scrollTo(0, 0);
  if (v === 'admin') return viewAdminLogin();
  if (v === 'dash') return viewDash();
  if (v === 'aexp') return viewAdminExport(h.slice(5));
  if (!me || v === 'reg') return viewReg();
  if (v === 'cls' && classes[+a]) return viewClass(+a);
  if (v === 'grade' && classes[+a]) return viewGrade(+a, b);
  if (v === 'exp' && classes[+a]) return viewExport(+a);
  return viewHome();
}
window.addEventListener('hashchange', () => route());

  ctx.students.forEach((s, k) => {
    const r = 9 + k, row = ws.getRow(r); row.height = 17;
    row.getCell(1).value = k + 1; row.getCell(2).value = s.n;
    const map = { 3: 'a1', 4: 'a2', 5: 'a3', 7: ar.exam, 9: 'm1', 10: 'm2', 11: 'm3', 12: 'm4', 14: ma.exam, 16: 'mu', 17: 'pl' };
    Object.entries(map).forEach(([c, f]) => { const v = ctx.get(s.id, f); row.getCell(+c).value = v == null ? null : v; });
    const caA = caAvg(ctx, s.id, ar), avA = subjAvg(ctx, s.id, ar), caM = caAvg(ctx, s.id, ma), avM = subjAvg(ctx, s.id, ma);
    row.getCell(6).value = { formula: `IF(COUNT(C${r}:E${r})=3,AVERAGE(C${r}:E${r}),"")`, result: caA == null ? '' : caA };
    row.getCell(8).value = { formula: `IF(AND(ISNUMBER(F${r}),ISNUMBER(G${r})),(F${r}+G${r})/2,"")`, result: avA == null ? '' : avA };
    row.getCell(13).value = { formula: `IF(COUNT(I${r}:L${r})=4,AVERAGE(I${r}:L${r}),"")`, result: caM == null ? '' : caM };
    row.getCell(15).value = { formula: `IF(AND(ISNUMBER(M${r}),ISNUMBER(N${r})),(M${r}+N${r})/2,"")`, result: avM == null ? '' : avM };
    for (let c = 1; c <= 17; c++){
      const cell = row.getCell(c); cell.border = border; cell.font = { name: FONT, size: 10 };
      cell.alignment = { horizontal: c === 2 ? 'right' : 'center', vertical: 'middle', readingOrder: 'rtl' };
      if (calc.includes(c)){ cell.numFmt = '0.00'; cell.fill = fill('FFF1F4F9'); }
      else if (inputs.includes(c) && cell.value == null) cell.fill = fill('FFFFC000');
    }
  });
  const fr = 9 + ctx.students.length + 1;
  ws.mergeCells(`A${fr}:H${fr}`); ws.getCell(`A${fr}`).value = `الأستاذ(ة): ${ctx.teacher || ''}`;
  ws.mergeCells(`I${fr}:Q${fr}`); ws.getCell(`I${fr}`).value = 'التوقيع:';
  [`A${fr}`, `I${fr}`].forEach(a => { ws.getCell(a).font = { name: FONT, size: 11 }; ws.getCell(a).alignment = { horizontal: 'right', readingOrder: 'rtl' }; });
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
async function saveBlob(blob, filename){
  if (IS_ARTIFACT){
    let dl = null; try { dl = await window.claude.use('downloads'); } catch(e){}
    if (!dl){ toast('التنزيل غير متاح في هذه النافذة'); return; }
    try { await dl.save({ filename, data: blob }); toast('تم حفظ الملف'); } catch(e){ toast(e && e.code === 'declined' ? 'أُلغي الحفظ' : 'تعذّر حفظ الملف'); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
  toast('تم تنزيل الملف');
}
async function shareBlob(blob, filename, type){
  try { await navigator.share({ files: [new File([blob], filename, { type })], title: filename }); }
  catch(e){ if (e && e.name !== 'AbortError') toast('تعذّرت المشاركة، استعمل التنزيل'); }
}
async function exportCtx(ctx, kind, share){
  busy(true, kind === 'pdf' ? 'جارٍ إعداد ملف PDF…' : 'جارٍ إعداد ملف Excel…');
  try {
    const blob = kind === 'pdf' ? await renderPDF(docPages(ctx), true, `التقويمات المستمرة - ${ctx.cls.label}`) : await buildXLSX(ctx);
    const name = fileBase(ctx) + (kind === 'pdf' ? '.pdf' : '.xlsx');
    busy(false);
    if (share) await shareBlob(blob, name, kind === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    else await saveBlob(blob, name);
  } catch(e){ busy(false); console.error(e); toast('حدث خطأ أثناء إعداد الملف'); }
}

/* =========================================================
   6) المدير: الدخول، اللوحة، رموز QR
   ========================================================= */

    <label class="fld" for="aKey">مفتاح المدير <small>(من ورقة «الإعدادات» في جدول المدرسة)</small>

}
let dashData = null;
async function viewDash(term){
  const a = adminOf(); if (!a) return location.replace('#admin');
  document.title = 'لوحة المدير';
  if (!dashData || term) app.innerHTML = `${topbar('لوحة المدير', '', me ? 'home' : 'reg')}<div class="wrap" style="padding:40px 16px;text-align:center"><span class="spin" style="display:inline-block"></span></div>`;
  try { const r = await api(a.api, { action: 'admin', key: a.key, term: term || (dashData && dashData.term) }); if (!r || !r.ok) throw r; dashData = r; }
  catch(e){ if (!dashData){ app.innerHTML = `${topbar('لوحة المدير', '', me ? 'home' : 'reg')}<div class="wrap" style="padding:20px 0"><div class="card"><p>${esc(errText(e))}</p><a class="btn" href="#admin">تعديل بيانات الدخول</a></div></div>`; return; } toast(errText(e)); }
  if (curView() !== 'dash') return;
  const d = dashData, SUBS = subjectsFor(2);
  app.innerHTML = `${topbar('لوحة المدير', `${d.school || SCHOOL_DEFAULT} · ${d.year}`, me ? 'home' : 'reg', `<button class="icon-btn" type="button" data-act="dashRefresh" aria-label="تحديث">${I.refresh}</button>`)}
  <div class="wrap" style="padding:14px 16px 40px;display:grid;gap:12px">
    <div class="setting"><p>الفصل المعروض<small>الفصل الحالي للأساتذة: ${TERMS[d.curTerm - 1]}</small></p>
      <div class="seg" role="group" aria-label="الفصل">${[1, 2, 3].map(t => `<button type="button" data-term="${t}" aria-pressed="${d.term === t}">${TERMS[t - 1]}</button>`).join('')}</div></div>
    ${d.term !== d.curTerm ? `<button class="btn" type="button" data-act="setTerm" data-t="${d.term}">جعل الفصل ${TERMS[d.term - 1]} هو الفصل الحالي للأساتذة</button>` : ''}
    <div class="row-btns"><button class="btn primary" type="button" data-act="qrAll">${I.qr}تنزيل رموز QR لكل الأقسام</button>
      <button class="btn" type="button" data-act="qrAdmin">${I.qr}فتح اللوحة على الهاتف</button></div>
    ${d.classes.map(c => `<div class="card ac">
      <div class="row"><b class="grow">${esc(c.label)}</b><span class="chip">${c.count} تلميذاً</span></div>
      <p class="muted" style="font-size:13px">${c.teachers.length ? c.teachers.map(t => `${esc(t.name)} · <a href="tel:${esc(t.phone)}" dir="ltr">${esc(t.phone)}</a>`).join('<br>') : 'لم يسجّل أي أستاذ بعد'}</p>
      <div class="mini">${SUBS.map(s => { const f = c.filled[s.id], n = c.needed[s.id], ok = c.confirms[s.id]; return `<span>${s.name}</span><div class="prog ${n && f === n ? 'full' : ''}"><i style="width:${n ? (f / n * 100).toFixed(0) : 0}%"></i></div><span>${f}/${n}${ok ? ' ✓' : ''}</span>`; }).join('')}</div>
      <div class="row-btns"><button class="btn small" type="button" data-act="qrOne" data-id="${esc(c.id)}">${I.qr}رمز القسم</button>
        <button class="btn small" type="button" data-go="aexp-${esc(c.id)}">${I.eye}الجدول</button></div>
    </div>`).join('')}
    <button class="btn danger-t" type="button" data-act="adminOut">خروج من لوحة المدير</button>
  </div>`;
}
const teacherLink = (a, c) => `${appBase()}#k=${c.token}&${linkParamsFor(a.api)}`;
async function qrImg(text, cell = 6){ await loadScript('qrcode.js'); const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(cell, 2); }
async function showQR(title, sub, link){
  const src = await qrImg(link, 8);
  const box = sheet(`<h2>${esc(title)}</h2><p class="muted">${esc(sub)}</p><div class="qrbig"><img src="${src}" alt="رمز QR"><div class="linkbox">${esc(link)}</div></div>
    <div class="acts"><button class="btn" type="button" id="cpLink">نسخ الرابط</button><button class="btn primary" type="button" data-close="1">إغلاق</button></div>`);
  box.querySelector('#cpLink').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('تم نسخ الرابط'); } catch(e){ toast('انسخ الرابط يدوياً'); } };
}
async function qrCardsPDF(){
  const a = adminOf(), d = dashData;
  busy(true, 'جارٍ إعداد بطاقات QR…');
  try {
    const cards = await Promise.all(d.classes.map(async c => `<div class="qrcard"><div class="s">${esc(d.school || SCHOOL_DEFAULT)} · منصة التقويم المستمر</div>
      <div class="c">${esc(c.label)}</div><img src="${await qrImg(teacherLink(a, c), 6)}" alt=""><div class="h">امسح الرمز بكاميرا الهاتف لتفتح قسمك وتلاميذك مباشرة</div></div>`));
    const pages = [];
    for (let k = 0; k < cards.length; k += 8) pages.push(`<div class="page port"><div class="qrgrid">${cards.slice(k, k + 8).join('')}</div></div>`);
    const blob = await renderPDF(pages, false, 'رموز QR للأقسام');
    busy(false); await saveBlob(blob, 'رموز_QR_الأقسام.pdf');
  } catch(e){ busy(false); console.error(e); toast('تعذّر إعداد الملف'); }
}
let adminCtxCache = {};
async function viewAdminExport(id){
  const a = adminOf(); if (!a) return location.replace('#admin');
  app.innerHTML = `${topbar('الجدول الموحّد', '', 'dash')}<div class="wrap" style="padding:40px 16px;text-align:center"><span class="spin" style="display:inline-block"></span></div>`;
  let r;
  try { r = await api(a.api, { action: 'adminClass', key: a.key, id, term: dashData && dashData.term }); if (!r || !r.ok) throw r; }
  catch(e){ app.innerHTML = `${topbar('الجدول الموحّد', '', 'dash')}<div class="wrap" style="padding:20px 0"><div class="card"><p>${esc(errText(e))}</p></div></div>`; return; }
  const cl = dashData && dashData.classes.find(c => c.id === id);
  const ctx = { c: r, term: r.term, year: r.year, school: r.school || SCHOOL_DEFAULT, cls: r.cls, students: r.students, subjects: subjectsFor(r.cls.level),
    teacher: cl && cl.teachers[0] ? cl.teachers[0].name : '', get(sid, f){ const m = r.marks[sid]; return m && m[f] != null ? m[f] : null; } };

  <div class="wrap"><div class="exp"><div class="card"><div class="row-btns">
    <button class="btn primary" type="button" data-act="apdf" data-id="${esc(id)}">${I.pdf}تنزيل PDF</button>
    <button class="btn primary" type="button" data-act="axlsx" data-id="${esc(id)}">${I.xls}تنزيل Excel</button></div></div>
    <div class="card"><div id="pv">${docPages(ctx).map(p => `<div class="pv">${p}</div>`).join('')}</div></div></div></div>`;
  fitPreview();
}

/* =========================================================
   الأحداث
   ========================================================= */
app.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const b = e.target.closest('[data-back]'); if (b){ back(b.dataset.back); return; }
  const st = e.target.closest('[data-step]'); if (st){ store.set('tq:step', +st.dataset.step); viewHome(); return; }
  const tm = e.target.closest('[data-term]'); if (tm){ viewDash(+tm.dataset.term); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'scan') return scanQR();
  if (act === 'install') return doInstall();
  if (act === 'noinstall'){ store.set('tq:noInstall', true); return viewHome(); }
  if (act === 'retry') return viewClass(+a.dataset.i);
  if (act === 'refresh'){ busy(true, 'جارٍ التحديث…'); try { await syncNow(classes[+a.dataset.i].k); await fetchClass(+a.dataset.i); busy(false); renderClass(+a.dataset.i); toast('تم التحديث'); } catch(err){ busy(false); toast(errText(err)); } return; }
  if (act === 'pdf' || act === 'xlsx') return exportCtx(ctxOf(+a.dataset.i), act);
  if (act === 'share-pdf' || act === 'share-xlsx') return exportCtx(ctxOf(+a.dataset.i), act.slice(6), true);
  if (act === 'apdf' || act === 'axlsx') return exportCtx(adminCtxCache[a.dataset.id], act.slice(1));
  if (act === 'dashRefresh') return viewDash(dashData && dashData.term);
  if (act === 'setTerm'){ const ad = adminOf(); busy(true); try { const r = await api(ad.api, { action: 'setTerm', key: ad.key, term: +a.dataset.t }); if (!r.ok) throw r; busy(false); toast('تم تغيير الفصل الحالي'); viewDash(+a.dataset.t); } catch(err){ busy(false); toast(errText(err)); } return; }
  if (act === 'qrAll') return qrCardsPDF();
  if (act === 'qrOne'){ const c = dashData.classes.find(x => x.id === a.dataset.id); return showQR(c.label, 'يمسحه الأستاذ بكاميرا هاتفه فيفتح قسمه مباشرة', teacherLink(adminOf(), c)); }
  if (act === 'qrAdmin'){ const ad = adminOf(); return showQR('فتح لوحة المدير على الهاتف', 'امسح هذا الرمز بهاتفك. لا تشاركه مع أحد', `${appBase()}#admin=${encodeURIComponent(ad.key)}&${linkParamsFor(ad.api)}`); }
  if (act === 'adminOut'){ store.del('tq:admin'); dashData = null; location.replace(me ? '#home' : '#reg'); return; }

  // صب النقاط
  const i = +app.dataset.i, sid = app.dataset.sub;
  if (act === 'confirm') return confirmSave(i, sid);
  let ctx = ctxOf(i); if (!ctx) return;
  const sub = ctx.subjects.find(s => s.id === sid), items = itemsOf(sub);
  if (act === 'tab'){
    const d = +a.dataset.d; ui.tab[i + sid] = d;
    $('#tabs').innerHTML = tabsHTML(ctx, sub, d);
    $('#domNow').innerHTML = `${items[d].exam ? '' : 'الميدان: '}<b>${esc(items[d].n)}</b>`;
    $('#list').innerHTML = ctx.students.map((s, k) => cardHTML(ctx, k, s, items[d].f)).join('');
    $('#sum').innerHTML = sumHTML(ctx, sub, d);
    window.scrollTo({ top: 0, behavior: 'auto' });
    return;
  }
  const card = a.closest('.st'); if (!card) return;
  const s = card.dataset.s, d = Math.min(ui.tab[i + sid] || 0, items.length - 1), f = items[d].f, v = ctx.get(s, f), step = getStep();
  if (act === 'set'){ ctx = setMark(ctx, s, f, +a.dataset.v); buzz(); }
  else if (act === 'plus' && v != null) ctx = setMark(ctx, s, f, v + step);
  else if (act === 'minus' && v != null) ctx = setMark(ctx, s, f, v - step);
  else if (act === 'del' && v != null){
    ctx = setMark(ctx, s, f, null);
    const nm = ctx.students.find(x => x.id === s).n;
    toast(`حُذفت علامة ${nm}`, { label: 'تراجع', fn: () => { const c2 = setMark(ctxOf(i), s, f, v); if (location.hash === `#grade-${i}-${sid}`) refreshCard(c2, sub, d, s); } });
  }
  refreshCard(ctx, sub, d, s);
  const nb = app.querySelector(`.st[data-s="${CSS.escape(s)}"] [data-act="${act}"]`);
  if (nb && !nb.disabled && act !== 'set') nb.focus({ preventScroll: true });
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- start ---------- */
(function boot(){
  const h = location.hash;
  if (h.includes('=')){
    const p = parseParams(h);
    if (p.k){ const i = addClass(p.k, apiFromParams(p)); history.replaceState(null, '', location.pathname + (me ? '#cls-' + i : '#reg')); }
    else if (p.admin){ store.set('tq:admin', { api: apiFromParams(p), key: p.admin }); history.replaceState(null, '', location.pathname + '#dash'); }
  }
  route();
  classes.forEach(c => scheduleSync(c.k, 1500));
  if (!IS_ARTIFACT && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
